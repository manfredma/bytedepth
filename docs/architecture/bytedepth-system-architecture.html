<!doctype html>

  <style>

    figure { margin:0; }
    svg { display:block; width:100%; min-width:960px; height:auto; }
    figcaption { margin-top:16px; color:var(--soft); font:12px/1.6 'Geist Mono',monospace; }

<body>
  <main>
    <p class="eyebrow">Architecture · Production overview</p>
    <h1>bytedepth 系统架构</h1>
    <p class="subtitle">Spring Boot 多模块博客的双机生产拓扑：两台应用入口以私网访问数据节点；Obsidian 笔记通过受控 API 同步为站内内容。</p>
