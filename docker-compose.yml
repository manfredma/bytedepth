version: '3.9'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-benchmark}
      MYSQL_DATABASE: bytedepth
    volumes:
      - /data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /data/redis:/data
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-bytedepth-search-key}
      MEILI_ENV: production
    volumes:
      - /data/meilisearch:/meili_data
    ports:
      - "7700:7700"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bytedepth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-benchmark}
      SPRING_DATA_REDIS_HOST: redis
      BYTEDEPTH_SEARCH_URL: http://meilisearch:7700
      BYTEDEPTH_SEARCH_API_KEY: ${MEILI_MASTER_KEY:-bytedepth-search-key}
      BYTEDEPTH_GEOIP_DB_PATH: /data/geoip/GeoLite2-City.mmdb
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
    volumes:
      - /data/images:/root/bytedepth/images
      - /data/geoip:/data/geoip:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  mysql_data:
  redis_data:
