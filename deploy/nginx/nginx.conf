events {
    worker_connections 1024;
}

http {
    # Docker 会在 app 容器重建后分配新 IP；请求时经 Docker DNS 重新解析，避免 Nginx 持有旧 IP。
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # HTTP -> HTTPS 跳转（仅域名）
    server {
        listen 80;
        server_name bytedepth.cn www.bytedepth.cn;
        return 301 https://$host$request_uri;
    }

    # IP 地址直接 HTTP 访问（不做 HTTPS 跳转）
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 10m;

        location / {
            set $app_upstream app:8080;
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name bytedepth.cn www.bytedepth.cn;

        ssl_certificate /etc/letsencrypt/live/bytedepth.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bytedepth.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            set $app_upstream app:8080;
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
