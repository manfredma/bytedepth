events {
    worker_connections 1024;
}

http {
    # 加载 conf.d 下的额外 server 块（如 career 工程的路由），与 staging-root.conf 对齐。
    # conf.d 通过宿主 /opt/nginx-conf.d 挂载，nginx 容器重建不丢失，新域名只需放 conf 文件。
    include /etc/nginx/conf.d/*.conf;
    # HTTP -> HTTPS 跳转（仅域名）
    server {
        listen 80;
        server_name bytedepth.cn www.bytedepth.cn;
        return 301 https://$host$request_uri;
    }

    # IP 地址直接 HTTP 访问（不做 HTTPS 跳转）
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 10m;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name bytedepth.cn www.bytedepth.cn;

        ssl_certificate /etc/letsencrypt/live/bytedepth.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bytedepth.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
