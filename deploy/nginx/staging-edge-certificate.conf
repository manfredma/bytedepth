# Production edge compatibility routes.
#
# The legacy staging hostname still resolves to 175 and must keep the previous
# production-entry behavior. It gets its own certificate and redirects to the
# production hostname; it never serves staging content.
server {
    listen 80;
    server_name staging.bytedepth.cn;
    return 301 https://bytedepth.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.bytedepth.cn;

    ssl_certificate /etc/letsencrypt/live/staging.bytedepth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.bytedepth.cn/privkey.pem;

    return 301 https://bytedepth.cn$request_uri;
}

# The new staging hostname is also monitored on 175 in some paths. 175 only
# presents its exact certificate so those checks do not see a fallback site's
# certificate; staging content remains served only by 124.
server {
    listen 80;
    server_name staging-bytedepth.bytedepth.cn;
    return 444;
}

server {
    listen 443 ssl;
    server_name staging-bytedepth.bytedepth.cn;

    ssl_certificate /etc/letsencrypt/live/staging-bytedepth.bytedepth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-bytedepth.bytedepth.cn/privkey.pem;

    return 444;
}
