# Production edge certificate-only route for the new staging hostname.
# 175 is also monitored in some paths. It only
# presents its exact certificate so those checks do not see a fallback site's
# certificate; staging content remains served only by 124.
server {
    listen 80;
    server_name staging-bytedepth.bytedepth.cn;
    return 444;
}

server {
    listen 443 ssl;
    server_name staging-bytedepth.bytedepth.cn;

    ssl_certificate /etc/letsencrypt/live/staging-bytedepth.bytedepth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-bytedepth.bytedepth.cn/privkey.pem;

    return 444;
}
