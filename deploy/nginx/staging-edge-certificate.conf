# Production edge placeholder for the staging hostname.
#
# 175 does not serve staging content. It only presents the same certificate so
# SNI/certificate monitors that probe both nodes do not see a fallback site's
# certificate. The exact Host is rejected after TLS; staging content remains
# served only by the staging host (124).
server {
    listen 80;
    server_name staging-bytedepth.bytedepth.cn;
    return 444;
}

server {
    listen 443 ssl;
    server_name staging-bytedepth.bytedepth.cn;

    ssl_certificate /etc/letsencrypt/live/staging-bytedepth.bytedepth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-bytedepth.bytedepth.cn/privkey.pem;

    return 444;
}
