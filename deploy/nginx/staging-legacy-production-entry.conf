# Compatibility route for the legacy staging hostname.
# It still resolves to 175 and follows the previous production-entry behavior;
# it never serves staging content.
server {
    listen 80;
    server_name staging.bytedepth.cn;
    return 301 https://bytedepth.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.bytedepth.cn;

    ssl_certificate /etc/letsencrypt/live/staging.bytedepth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.bytedepth.cn/privkey.pem;

    return 301 https://bytedepth.cn$request_uri;
}
