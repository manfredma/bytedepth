events {
    worker_connections 1024;
}

http {
    # Docker DNS：app 容器重建后 IP 可能变，请求时经 Docker DNS 重新解析。
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    map $arg_preview $staging_preview_query_enabled {
        default 0;
        true 1;
    }
    map $cookie_staging_preview $staging_preview_cookie_enabled {
        default 0;
        1 1;
    }
    map "$staging_preview_query_enabled:$staging_preview_cookie_enabled" $staging_preview_enabled {
        default 0;
        ~^1: 1;
        ~:1$ 1;
    }
    map "$arg_preview:$staging_preview_enabled" $staging_preview_cookie_header {
        default "";
        ~^true:1$ "staging_preview=1; Max-Age=604800; Path=/; Secure; HttpOnly; SameSite=Lax";
        ~^false: "staging_preview=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax";
    }
    map $args $staging_redirect_args {
        default ?$args;
        "" "";
        ~^preview=(true|false)$ "";
        ~^preview=(true|false)&(.+)$ ?$2;
        ~^(.+)&preview=(true|false)$ ?$1;
        ~^(.+)&preview=(true|false)&(.+)$ ?$1&$3;
    }

    # staging server 配置由 /etc/nginx/templates/default.conf.template 经 envsubst 生成。
    include /etc/nginx/conf.d/*.conf;
}
