<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <defs>
    <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- 外圈实线（小尺寸下比虚线清晰） -->
  <circle cx="55" cy="55" r="50" fill="none" stroke="url(#gF)" stroke-width="4" opacity="0.8"/>
  <!-- 内圆背景 -->
  <circle cx="55" cy="55" r="40" fill="#062a22"/>
  <!-- bd 字母，加大字号确保清晰 -->
  <text x="55" y="66" font-size="28"
        font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-weight="700" text-anchor="middle"
        fill="url(#gF)" letter-spacing="1">bd</text>
</svg>
