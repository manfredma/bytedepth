spring:
  config:
    activate:
      on-profile: staging-e2e
  datasource:
    url: ${BYTEDEPTH_STAGING_E2E_DATASOURCE_URL}
    username: ${BYTEDEPTH_STAGING_E2E_DATASOURCE_USERNAME}
    password: ${BYTEDEPTH_STAGING_E2E_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${BYTEDEPTH_STAGING_E2E_REDIS_HOST:127.0.0.1}
      port: ${BYTEDEPTH_STAGING_E2E_REDIS_PORT:6379}
      database: ${BYTEDEPTH_STAGING_E2E_REDIS_DATABASE}
      password: ${BYTEDEPTH_STAGING_E2E_REDIS_PASSWORD}
  session:
    redis:
      namespace: ${BYTEDEPTH_STAGING_E2E_REDIS_SESSION_NAMESPACE}

bytedepth:
  redis:
    key-namespace: ${BYTEDEPTH_STAGING_E2E_REDIS_KEY_NAMESPACE}
  rate-limit:
    redis:
      host: ${BYTEDEPTH_STAGING_E2E_REDIS_HOST:127.0.0.1}
      port: ${BYTEDEPTH_STAGING_E2E_REDIS_PORT:6379}
      password: ${BYTEDEPTH_STAGING_E2E_REDIS_PASSWORD}
      database: ${BYTEDEPTH_STAGING_E2E_REDIS_DATABASE}
      key-namespace: ${BYTEDEPTH_STAGING_E2E_REDIS_KEY_NAMESPACE}
  search:
    url: ${BYTEDEPTH_STAGING_E2E_SEARCH_URL:http://127.0.0.1:7700}
    api-key: ${BYTEDEPTH_STAGING_E2E_SEARCH_API_KEY}
    index: ${BYTEDEPTH_STAGING_E2E_SEARCH_INDEX}
  upload:
    image-dir: ${BYTEDEPTH_STAGING_E2E_UPLOAD_IMAGE_DIR}
