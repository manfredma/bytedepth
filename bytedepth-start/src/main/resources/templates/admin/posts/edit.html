<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/post-editor.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.css">
    <title th:text="${post != null} ? '编辑文章 - bytedepth' : '写文章 - bytedepth'">写文章 - bytedepth</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(false)}"></nav>
<div class="admin-shell">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('posts')}"></aside>
<main class="admin-main">
    <div class="post-editor-page">
        <header class="post-editor-header">
            <div>
                <p class="post-editor-eyebrow">文章管理</p>
                <h1 th:text="${post != null} ? '编辑文章' : '写文章'">写文章</h1>
            </div>
            <a th:href="@{/admin/posts}" class="post-editor-back">← 返回文章列表</a>
        </header>

        <!-- 编辑模式 -->
        <form class="post-editor-form" th:if="${post != null}"
              th:action="@{/admin/posts/{id}(id=${post.id})}" method="post">
            <section class="post-editor-writing" aria-label="文章内容">
                <label class="post-editor-label" for="post-title">标题</label>
                <input class="post-editor-title" id="post-title" type="text" name="title"
                       placeholder="给这篇文章起个标题" th:value="${post.title}" required>
                <textarea class="post-editor-source" id="content-editor" name="content" hidden
                          th:text="${post.content}"></textarea>
                <div class="post-editor-vditor" id="vditor-editor"></div>
                <p class="post-editor-status">内容以 Markdown 原文保存；可直接粘贴图片或通过工具栏上传。</p>
            </section>

            <aside class="post-editor-settings" aria-label="文章设置">
                <div class="post-editor-settings-heading">
                    <h2>发布设置</h2>
                    <p>管理文章地址和分类</p>
                </div>
                <div class="post-editor-field">
                    <label for="post-slug">Slug（URL 标识）</label>
                    <input id="post-slug" type="text" th:value="${post.slug}" readonly>
                    <p>创建后不可修改，地址：<code th:text="${'/posts/' + post.slug}">/posts/slug</code></p>
                </div>
                <div class="post-editor-field" th:if="${categories != null and not #lists.isEmpty(categories)}">
                    <label for="post-category">分类 <span aria-hidden="true">*</span></label>
                    <select id="post-category" name="categoryId" required>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                th:selected="${post.categoryId != null and post.categoryId == c.id}">分类名</option>
                    </select>
                </div>
                <div class="post-editor-actions">
                    <button type="submit" class="post-editor-save">保存修改</button>
                    <a th:href="@{/admin/posts}" class="post-editor-cancel">取消</a>
                </div>
            </aside>
        </form>

        <section class="post-editor-tags" th:if="${post != null}" aria-label="文章标签">
            <form th:action="@{/admin/posts/{id}/tags(id=${post.id})}" method="post">
                <div class="post-editor-tags-copy">
                    <h2>标签</h2>
                    <p>用英文逗号或空格分隔，例如 <code>gc, jvm, 理论</code>。</p>
                </div>
                <div class="post-editor-tags-control">
                    <input type="text" name="rawTags"
                           th:value="${post.tagSlugs != null ? #strings.listJoin(post.tagSlugs, ', ') : ''}"
                           placeholder="gc, jvm, memory-management">
                    <button type="submit">保存标签</button>
                </div>
            </form>
        </section>

        <!-- 新建模式 -->
        <form class="post-editor-form" th:if="${post == null}"
              th:action="@{/admin/posts}" method="post" th:object="${cmd}">
            <section class="post-editor-writing" aria-label="文章内容">
                <label class="post-editor-label" for="post-title">标题</label>
                <input class="post-editor-title" id="post-title" type="text" name="title"
                       placeholder="给这篇文章起个标题" th:field="*{title}" required>
                <textarea class="post-editor-source" id="content-editor" name="content" hidden
                          th:field="*{content}"></textarea>
                <div class="post-editor-vditor" id="vditor-editor"></div>
                <p class="post-editor-status">内容以 Markdown 原文保存；可直接粘贴图片或通过工具栏上传。</p>
            </section>

            <aside class="post-editor-settings" aria-label="文章设置">
                <div class="post-editor-settings-heading">
                    <h2>发布设置</h2>
                    <p>新文章会先保存为草稿</p>
                </div>
                <div class="post-editor-field">
                    <label for="post-slug">Slug（URL 标识）</label>
                    <input id="post-slug" type="text" name="slug" th:field="*{slug}"
                           placeholder="如 java-gc-intro"
                           pattern="[a-z0-9][a-z0-9\-]*[a-z0-9]"
                           title="只允许小写英文、数字和连字符（-），首尾须为英数字">
                    <p>留空将根据标题自动生成。</p>
                </div>
                <div class="post-editor-field" th:if="${categories != null and not #lists.isEmpty(categories)}">
                    <label for="post-category">分类 <span aria-hidden="true">*</span></label>
                    <select id="post-category" name="categoryId" required>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">分类名</option>
                    </select>
                </div>
                <div class="post-editor-actions">
                    <button type="submit" class="post-editor-save">保存草稿</button>
                    <a th:href="@{/admin/posts}" class="post-editor-cancel">取消</a>
                </div>
            </aside>
        </form>
    </div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.min.js"></script>
<script th:src="@{/js/post-editor.js}"></script>
</body>
</html>
