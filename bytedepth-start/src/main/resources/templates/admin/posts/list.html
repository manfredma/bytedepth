<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <title>文章管理 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #1a1a2e; margin: 0; }
        .btn-new { padding: 8px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 4px; font-size: 0.9em; font-weight: 500; }
        .btn-new:hover { background: #c73652; }
        .post-card { background: white; padding: 18px 24px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; gap: 16px; align-items: center; }
        .info { flex: 1; min-width: 0; }
        .title { font-weight: 600; color: #1a1a2e; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 0.82em; color: #aaa; margin-top: 4px; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.78em; font-weight: 600; margin-right: 8px; }
        .badge-draft { background: #fff3cd; color: #856404; }
        .badge-published { background: #d1f0e0; color: #1a7a4a; }
        .badge-deleted { background: #f8d7da; color: #842029; }
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-edit { padding: 5px 14px; background: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 4px; text-decoration: none; font-size: 0.85em; cursor: pointer; }
        .btn-edit:hover { background: #e0e0e0; }
        .btn-publish { padding: 5px 14px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 0.85em; cursor: pointer; }
        .btn-publish:hover { background: #27ae60; }
        .btn-delete { padding: 5px 14px; background: #e74c3c; color: white; border: none; border-radius: 4px; font-size: 0.85em; cursor: pointer; }
        .btn-delete:hover { background: #c0392b; }
        .empty { color: #888; text-align: center; padding: 60px; background: white; border-radius: 8px; }
        form { display: inline; margin: 0; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 28px 0 8px; }
        .pagination a, .pagination span { padding: 6px 12px; border-radius: 4px; font-size: 0.88em; text-decoration: none; }
        .pagination a { background: white; border: 1px solid #ddd; color: #333; }
        .pagination a:hover { background: #f0f0f0; }
        .pagination .current { background: #e94560; color: white; border: 1px solid #e94560; font-weight: 600; }
        .pagination .disabled { color: #bbb; cursor: default; }
        .page-info { text-align: center; font-size: 0.82em; color: #aaa; margin-bottom: 4px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <div class="page-header">
        <h1>文章管理</h1>
        <a th:href="@{/admin/posts/new}" class="btn-new">+ 写文章</a>
    </div>

    <div th:if="${#lists.isEmpty(posts)}" class="empty">暂无文章</div>

    <div th:each="p : ${posts}" class="post-card">
        <div class="info">
            <div class="title" th:text="${p.title}">文章标题</div>
            <div class="meta">
                <span th:class="${'badge badge-' + p.status.toLowerCase()}"
                      th:text="${p.status == 'PUBLISHED' ? '已发布' : (p.status == 'DRAFT' ? '草稿' : '已删除')}">状态</span>
                <span th:if="${p.createdAt != null}"
                      th:text="'创建于 ' + ${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span>
                <span th:if="${p.publishedAt != null}"
                      th:text="'  ·  发布于 ' + ${#temporals.format(p.publishedAt, 'yyyy-MM-dd HH:mm')}">发布时间</span>
            </div>
        </div>
        <div class="actions">
            <a th:href="@{/admin/posts/{id}/edit(id=${p.id})}" class="btn-edit">编辑</a>
            <form th:if="${p.status == 'DRAFT'}"
                  th:action="@{/admin/posts/{id}/publish(id=${p.id})}" method="post">
                <button type="submit" class="btn-publish">发布</button>
            </form>
            <form th:action="@{/admin/posts/{id}/delete(id=${p.id})}" method="post"
                  onsubmit="return confirm('确认删除此文章？')">
                <button type="submit" class="btn-delete">删除</button>
            </form>
        </div>
    </div>

    <!-- 分页 -->
    <div th:if="${totalPages > 1}">
        <p class="page-info"
           th:text="'共 ' + ${total} + ' 篇，第 ' + ${currentPage} + ' / ' + ${totalPages} + ' 页'"></p>
        <div class="pagination">
            <!-- 上一页 -->
            <a th:if="${currentPage > 1}"
               th:href="@{/admin/posts(page=${currentPage - 1}, size=${pageSize})}">&#8592; 上一页</a>
            <span th:if="${currentPage == 1}" class="disabled">&#8592; 上一页</span>

            <!-- 页码：当前页前后各 2 页 -->
            <th:block th:each="p : ${#numbers.sequence(
                    T(java.lang.Math).max(1, currentPage - 2),
                    T(java.lang.Math).min(totalPages, currentPage + 2))}">
                <a th:if="${p != currentPage}"
                   th:href="@{/admin/posts(page=${p}, size=${pageSize})}"
                   th:text="${p}">1</a>
                <span th:if="${p == currentPage}" class="current" th:text="${p}">1</span>
            </th:block>

            <!-- 下一页 -->
            <a th:if="${currentPage < totalPages}"
               th:href="@{/admin/posts(page=${currentPage + 1}, size=${pageSize})}">下一页 &#8594;</a>
            <span th:if="${currentPage == totalPages}" class="disabled">下一页 &#8594;</span>
        </div>
    </div>
</div>
</body>
</html>
