<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <title>标签管理 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        th { color: #888; font-size: 0.85em; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
        td { color: #333; font-size: 0.95em; }
        tr:last-child td { border-bottom: none; }
        .empty { color: #888; text-align: center; padding: 40px; }
        h2 { color: #1a1a2e; font-size: 1.1em; margin-top: 0; margin-bottom: 16px; }
        .slug-badge { display: inline-block; background: #f0f2f5; color: #666; padding: 2px 8px; border-radius: 4px; font-size: 0.82em; font-family: monospace; }
        .count-badge { display: inline-block; background: #e8f0fe; color: #1967d2; padding: 2px 8px; border-radius: 12px; font-size: 0.82em; font-weight: 600; }
        .back-link { color: #e94560; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="admin-shell">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('tags')}"></aside>
<div class="admin-main">
<div class="container">
    <h1>标签管理</h1>

    <div class="card">
        <h2>所有标签</h2>
        <div th:if="${#lists.isEmpty(tags)}" class="empty">暂无标签</div>
        <table th:if="${!#lists.isEmpty(tags)}">
            <thead>
                <tr>
                    <th>名称</th>
                    <th>Slug</th>
                    <th>文章数</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tag : ${tags}">
                    <td th:text="${tag.name}">标签名</td>
                    <td><span class="slug-badge" th:text="${tag.slug}">slug</span></td>
                    <td><span class="count-badge" th:text="${tag.count}">0</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/admin}" class="back-link">← 返回后台</a>
</div>
</div>
</div>
</body>
</html>
