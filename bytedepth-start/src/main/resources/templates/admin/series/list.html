<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <title>专栏管理 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        th { color: #888; font-size: 0.85em; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
        td { color: #333; font-size: 0.95em; }
        tr:last-child td { border-bottom: none; }
        .empty { color: #888; text-align: center; padding: 40px; }
        h2 { color: #1a1a2e; font-size: 1.1em; margin-top: 0; margin-bottom: 16px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.82em; color: #888; font-weight: 600; }
        input[type="text"] { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.92em; }
        input[type="text"]:focus { border-color: #e94560; outline: none; }
        .btn-submit { padding: 8px 20px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.92em; }
        .btn-submit:hover { background: #c73652; }
        .slug-badge { display: inline-block; background: #f0f2f5; color: #666; padding: 2px 8px; border-radius: 4px; font-size: 0.82em; font-family: monospace; }
        .desc-text { color: #888; font-size: 0.88em; }
        .back-link { color: #e94560; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(false)}"></nav>
<div class="admin-shell">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('series')}"></aside>
<div class="admin-main">
<div class="container">
    <h1>专栏管理</h1>

    <div th:replace="~{fragments/filter-bar :: filterBar('/admin/series', ${filterFields})}"></div>

    <!-- 专栏列表 -->
    <div class="card">
        <h2>所有专栏</h2>
        <div th:if="${#lists.isEmpty(seriesList)}" class="empty">暂无专栏，在下方新建</div>
        <table th:if="${!#lists.isEmpty(seriesList)}">
            <thead>
                <tr>
                    <th>名称</th>
                    <th>Slug</th>
                    <th>简介</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${seriesList}">
                    <td th:text="${s.name}">专栏名</td>
                    <td><span class="slug-badge" th:text="${s.slug}">slug</span></td>
                    <td><span class="desc-text" th:text="${s.description != null ? s.description : '—'}">简介</span></td>
                    <td style="white-space:nowrap;">
                        <a th:href="@{/admin/series/{slug}(slug=${s.slug})}"
                           style="color:#e94560;text-decoration:none;font-size:0.85em;font-weight:600;">管理文章 →</a>
                        <form th:action="@{/admin/series/{id}/delete(id=${s.id})}" method="post"
                              style="display:inline;margin-left:12px;"
                              data-bd-confirm
                              data-bd-confirm-title="删除专栏"
                              th:attr="data-bd-confirm-message=|确认删除专栏「${s.name}」？&#10;该专栏下所有文章将解除关联，文章本身不会删除。|"
                              data-bd-confirm-tone="danger"
                              data-bd-confirm-confirm-text="删除">
                            <button type="submit"
                                    style="padding:3px 10px;background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;border-radius:4px;font-size:0.82em;cursor:pointer;">
                                删除
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${totalPages > 1}" th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${total}, ${pageSize}, ${filterBaseUrl})}"></div>

    <!-- 新建专栏 -->
    <div class="card">
        <h2>新建专栏</h2>
        <form th:action="@{/admin/series}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" name="name" placeholder="例：GC 垃圾回收专栏" required>
                </div>
                <div class="form-group">
                    <label>Slug</label>
                    <input type="text" name="slug" placeholder="例：gc-series" required>
                </div>
                <div class="form-group">
                    <label>简介（可选）</label>
                    <input type="text" name="description" placeholder="一句话描述" style="width:220px">
                </div>
                <button type="submit" class="btn-submit">创建专栏</button>
            </div>
        </form>
    </div>

    <a th:href="@{/admin}" class="back-link">← 返回后台</a>
</div>
</div>
</div>
</body>
</html>
