<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <title>添加项目 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 640px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        h1 { margin-top: 0; color: #1a1a2e; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 0.88em; font-weight: 500; color: #555; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 9px 13px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95em; }
        textarea { height: 80px; resize: vertical; }
        .hint { font-size: 0.82em; color: #aaa; margin-top: 4px; }
        .btn { padding: 10px 24px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <div class="card">
        <h1>添加项目</h1>
        <form th:action="@{/admin/projects}" method="post">
            <div class="field"><label>项目名 *</label><input name="name" required></div>
            <div class="field"><label>描述</label><textarea name="description"></textarea></div>
            <div class="field">
                <label>技术栈</label>
                <input name="techStack" placeholder="Java, Spring Boot, MySQL（逗号分隔）">
            </div>
            <div class="field"><label>GitHub 地址</label><input name="githubUrl" type="url"></div>
            <div class="field"><label>演示地址</label><input name="demoUrl" type="url"></div>
            <div class="field">
                <label>排序</label>
                <input name="sortOrder" type="number" value="0">
                <p class="hint">数字越小越靠前</p>
            </div>
            <button type="submit" class="btn">保存</button>
        </form>
    </div>
</div>
</body>
</html>
