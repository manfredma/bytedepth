<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <title>管理后台 - bytedepth</title>
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               margin: 0; background: #f0f2f5; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(false)}"></nav>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar('dashboard')}"></aside>
    <div class="admin-main">

        <!-- 顶部快捷操作栏 -->
        <div class="admin-quickbar">
            <a th:href="@{/admin/posts/new}" class="aq-primary">＋ 新建文章</a>
            <a th:href="@{/admin/comments}" class="aq-outline">💬 评论管理</a>
            <a th:href="@{/admin/analytics}" class="aq-outline">📊 访问统计</a>
            <a href="/" target="_blank" class="aq-outline">🌐 查看前台 ↗</a>
        </div>

        <!-- 数据总览（卡片可点击跳转） -->
        <div class="admin-stats">
            <a th:href="@{/admin/posts}" class="admin-stat-card">
                <div class="stat-num" th:text="${stats.totalPosts}">0</div>
                <div class="stat-label">全部文章</div>
            </a>
            <a th:href="@{/admin/posts}" class="admin-stat-card">
                <div class="stat-num" th:text="${stats.publishedPosts}">0</div>
                <div class="stat-label">已发布</div>
            </a>
            <a th:href="@{/admin/comments}" class="admin-stat-card">
                <div class="stat-num" th:text="${stats.pendingComments}">0</div>
                <div class="stat-label">待审评论</div>
            </a>
            <a th:href="@{/admin/projects/new}" class="admin-stat-card">
                <div class="stat-num" th:text="${stats.totalProjects}">0</div>
                <div class="stat-label">项目展示</div>
            </a>
        </div>

    </div>
</div>
</body>
</html>
