<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>管理后台 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; margin-bottom: 32px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 28px 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center; }
        .stat-card .number { font-size: 2.4em; font-weight: 700; color: #e94560; line-height: 1; }
        .stat-card .label { margin-top: 8px; color: #888; font-size: 0.9em; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .nav-card { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-decoration: none; color: #1a1a2e; transition: box-shadow .2s, transform .2s; display: flex; flex-direction: column; gap: 8px; }
        .nav-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.14); transform: translateY(-2px); }
        .nav-card .icon { font-size: 1.8em; }
        .nav-card .title { font-weight: 600; font-size: 1em; }
        .nav-card .desc { color: #888; font-size: 0.82em; }
        h2 { color: #1a1a2e; margin: 32px 0 16px; font-size: 1.1em; text-transform: uppercase; letter-spacing: .05em; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <h1>管理后台</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="number" th:text="${stats.totalPosts}">0</div>
            <div class="label">全部文章</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${stats.publishedPosts}">0</div>
            <div class="label">已发布</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${stats.pendingComments}">0</div>
            <div class="label">待审评论</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${stats.totalProjects}">0</div>
            <div class="label">项目展示</div>
        </div>
    </div>

    <h2>快捷入口</h2>
    <div class="nav-grid">
        <a th:href="@{/admin/posts}" class="nav-card">
            <span class="icon">📝</span>
            <span class="title">文章管理</span>
            <span class="desc">新建、编辑、发布、删除文章</span>
        </a>
        <a th:href="@{/admin/comments}" class="nav-card">
            <span class="icon">💬</span>
            <span class="title">评论审核</span>
            <span class="desc">审核待处理的访客评论</span>
        </a>
        <a th:href="@{/admin/projects/new}" class="nav-card">
            <span class="icon">🚀</span>
            <span class="title">新增项目</span>
            <span class="desc">添加项目展示卡片</span>
        </a>
        <a th:href="@{/admin/categories}" class="nav-card">
            <span class="icon">🗂️</span>
            <span class="title">分类管理</span>
            <span class="desc">新建和管理文章分类</span>
        </a>
        <a th:href="@{/admin/tags}" class="nav-card">
            <span class="icon">🏷️</span>
            <span class="title">标签管理</span>
            <span class="desc">查看和管理文章标签</span>
        </a>
        <a th:href="@{/admin/series}" class="nav-card">
            <span class="icon">📚</span>
            <span class="title">系列管理</span>
            <span class="desc">新建和管理文章系列</span>
        </a>
        <a th:href="@{/}" class="nav-card">
            <span class="icon">🌐</span>
            <span class="title">查看前台</span>
            <span class="desc">打开博客前台页面</span>
        </a>
    </div>
</div>
</body>
</html>
