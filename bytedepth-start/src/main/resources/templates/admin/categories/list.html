<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <title>分类管理 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        th { color: #888; font-size: 0.85em; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
        td { color: #333; font-size: 0.95em; }
        tr:last-child td { border-bottom: none; }
        tr.child-row td:first-child { padding-left: 32px; }
        tr.child-row td:first-child::before { content: "└ "; color: #aaa; }
        .empty { color: #888; text-align: center; padding: 40px; }
        h2 { color: #1a1a2e; font-size: 1.1em; margin-top: 0; margin-bottom: 16px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.82em; color: #888; font-weight: 600; }
        input[type="text"], select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.92em; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #e94560; }
        .btn-submit { padding: 8px 20px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.92em; white-space: nowrap; }
        .btn-submit:hover { background: #c73652; }
        .slug-badge { display: inline-block; background: #f0f2f5; color: #666; padding: 2px 8px; border-radius: 4px; font-size: 0.82em; font-family: monospace; }
        .parent-badge { color: #e94560; font-size: 0.85em; background: #fff3f5; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(false)}"></nav>
<div class="admin-shell">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('categories')}"></aside>
<div class="admin-main">
<div class="container">
    <h1>分类管理</h1>

    <!-- 分类列表（树形展示） -->
    <div th:replace="~{fragments/filter-bar :: filterBar('/admin/categories', ${filterFields})}"></div>
    <div class="card">
        <h2>所有分类</h2>
        <div th:if="${#lists.isEmpty(categories)}" class="empty">暂无分类，请在下方添加</div>
        <table th:if="${!#lists.isEmpty(categories)}">
            <thead>
                <tr>
                    <th>名称</th>
                    <th>Slug</th>
                    <th>父分类</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categories}" th:classappend="${cat.depth > 0 ? 'child-row' : ''}">
                    <td th:text="${cat.name}">分类名</td>
                    <td><span class="slug-badge" th:text="${cat.slug}">slug</span></td>
                    <td>
                        <span th:if="${cat.parentName != null}" class="parent-badge" th:text="${cat.parentName}">父分类名</span>
                        <span th:if="${cat.parentName == null}" style="color:#aaa;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 新建分类表单 -->
    <div class="card">
        <h2>新建分类</h2>
        <form th:action="@{/admin/categories}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">名称</label>
                    <input type="text" id="name" name="name" placeholder="例：后端开发" required>
                </div>
                <div class="form-group">
                    <label for="slug">Slug</label>
                    <input type="text" id="slug" name="slug" placeholder="例：backend" required>
                </div>
                <div class="form-group">
                    <label for="parentId">父分类（可选）</label>
                    <select id="parentId" name="parentId">
                        <option value="">无（顶级分类）</option>
                        <option th:each="cat : ${categories}"
                                th:if="${cat.depth == 0}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">分类名</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">添加分类</button>
            </div>
        </form>
    </div>
</div>
</div>
</div>
</body>
</html>
