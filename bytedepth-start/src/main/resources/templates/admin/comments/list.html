<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <title>评论审核 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; }
        .comment-card { background: white; padding: 20px 24px; margin: 12px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; gap: 16px; align-items: flex-start; }
        .info { flex: 1; }
        .author { font-weight: 600; color: #1a1a2e; }
        .post-link { font-size: 0.85em; color: #888; margin-left: 8px; }
        .post-link a { color: #e94560; text-decoration: none; }
        .time { font-size: 0.82em; color: #aaa; }
        .body { margin-top: 8px; color: #333; line-height: 1.6; }
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-approve { padding: 6px 14px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.88em; }
        .btn-reject { padding: 6px 14px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.88em; }
        .empty { color: #888; text-align: center; padding: 60px; background: white; border-radius: 8px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <h1>待审核评论</h1>
    <div th:if="${#lists.isEmpty(comments)}" class="empty">暂无待审核评论 🎉</div>
    <div th:each="c : ${comments}" class="comment-card">
        <div class="info">
            <span class="author" th:text="${c.authorName}">作者</span>
            <span class="post-link">来自：<a th:href="@{/posts/{id}(id=${c.postId})}" th:text="'文章 #' + ${c.postId}" target="_blank">文章</a></span>
            <div class="time" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">时间</div>
            <div class="body" th:text="${c.content}">内容</div>
        </div>
        <div class="actions">
            <form th:action="@{/admin/comments/{id}/approve(id=${c.id})}" method="post">
                <button type="submit" class="btn-approve">通过</button>
            </form>
            <form th:action="@{/admin/comments/{id}/reject(id=${c.id})}" method="post">
                <button type="submit" class="btn-reject">拒绝</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
