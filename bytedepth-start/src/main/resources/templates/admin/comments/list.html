<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <th:block th:replace="~{fragments/favicon-head :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <title>评论列表 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; }
        .comment-card {
            background: white; padding: 20px 24px; margin: 12px 0;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .author { font-weight: 600; color: #1a1a2e; }
        .post-link { font-size: 0.85em; color: #888; margin-left: 8px; }
        .post-link a { color: var(--admin-accent); text-decoration: none; }
        .time { font-size: 0.82em; color: #aaa; }
        .body { margin-top: 8px; color: #333; line-height: 1.6; }
        .comment-actions { margin-top: 14px; }
        .comment-delete-form { display: inline; }
        .comment-delete-button { border: 0; border-radius: 4px; background: #fff1f0; color: #cf1322;
                                 cursor: pointer; font: inherit; padding: 6px 10px; }
        .comment-delete-button:hover { background: #ffccc7; }
        .empty { color: #888; text-align: center; padding: 60px;
                 background: white; border-radius: 8px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(false)}"></nav>
<div class="admin-shell">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('comments')}"></aside>
<div class="admin-main">
<div class="container">
    <h1>评论列表</h1>

    <!-- 统一查询过滤组件 -->
    <div th:replace="~{fragments/filter-bar :: filterBar('/admin/comments', ${filterFields})}"></div>

    <div th:if="${#lists.isEmpty(comments)}" class="empty">暂无评论</div>
    <div th:each="c : ${comments}" class="comment-card">
        <span class="author" th:text="${c.authorName}">作者</span>
        <span class="post-link">来自：
            <a th:href="@{/posts/{slug}(slug=${c.postSlug})}"
               th:text="'文章 #' + ${c.postId}" target="_blank">文章</a>
        </span>
        <div class="time" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">时间</div>
        <div class="body" th:text="${c.content}">内容</div>
        <div class="comment-actions">
            <form class="comment-delete-form" method="post" th:action="@{/admin/comments/{id}/delete(id=${c.id})}"
                  data-bd-confirm
                  data-bd-confirm-title="删除评论"
                  data-bd-confirm-message="确认永久删除这条评论？此操作无法恢复。"
                  data-bd-confirm-tone="danger"
                  data-bd-confirm-confirm-text="删除">
                <button class="comment-delete-button" type="submit">删除</button>
            </form>
        </div>
    </div>

    <!-- 分页（filterBaseUrl 携带过滤条件） -->
    <div th:if="${totalPages > 1}">
        <div th:replace="~{fragments/pagination :: pagination(
            ${currentPage}, ${totalPages}, ${total}, ${pageSize}, ${filterBaseUrl})}"></div>
    </div>
</div>
</div>
</div>
</body>
</html>
