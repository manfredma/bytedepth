<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <th:block th:replace="~{fragments/pwa-head :: pwa}"></th:block>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-switcher.js}"></script>
    <title th:text="${post.title} + ' - bytedepth'">文章详情</title>
    <!-- SEO -->
    <meta name="description" th:if="${metaDescription != null}" th:content="${metaDescription}">
    <link rel="canonical" th:if="${canonicalUrl != null}" th:href="${canonicalUrl}">
    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="ByteDepth">
    <meta property="og:title" th:content="${post.title}">
    <meta property="og:description" th:if="${metaDescription != null}" th:content="${metaDescription}">
    <meta property="og:url" th:if="${canonicalUrl != null}" th:content="${canonicalUrl}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        var(--bd-bg, #f7f5f0);
            --card:      var(--bd-surface, #ffffff);
            --ink:       var(--bd-text, #1c1917);
            --ink-2:     var(--bd-text-muted, #57534e);
            --ink-3:     var(--bd-text-subtle, #a8a29e);
            --accent:    var(--bd-accent, #e94560);
            --accent-dk: var(--bd-accent-hover, #c73652);
            --accent-fg: var(--bd-accent-text, #ffffff);
            --navy:      var(--bd-nav-bg, #1a1a2e);
            --navy-fg:   var(--bd-nav-text, #ffffff);
            --border:    var(--bd-border, #e7e4df);
            --code-bg:   var(--bd-code-bg, #0d1117);
            --code-fg:   var(--bd-code-text, #e6edf3);
            --serif:     'Source Serif 4', Georgia, serif;
            --display:   'DM Serif Display', Georgia, serif;
            --sans:      'Outfit', system-ui, sans-serif;
            --mono:      'JetBrains Mono', 'Fira Code', monospace;
            --radius:    10px;
            --shadow:    var(--bd-shadow, 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06));
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--serif);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 容器 ─────────────────────────────── */
        .container {
            max-width: 80vw;
            margin: 48px auto;
            padding: 56px 64px 64px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* ── 文章标题区 ───────────────────────── */
        h1 {
            font-family: var(--display);
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            font-weight: 400;
            color: var(--ink);
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-bottom: 20px;
        }
        .meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-family: var(--sans);
            font-size: 0.82rem;
            color: var(--ink-3);
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }
        .meta-sep { color: var(--border); }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;
            letter-spacing: .03em;
        }

        /* ── 标签 ────────────────────────────── */
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
        .tag {
            font-family: var(--sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: .05em;
            color: var(--ink-2);
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 3px 11px;
            border-radius: 20px;
            text-decoration: none;
            transition: all .15s;
        }
        .tag:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

        /* ── 正文内容 ─────────────────────────── */
        .content { font-size: 1.05rem; line-height: 1.85; color: var(--ink); }
        .content h1,.content h2,.content h3,.content h4 {
            font-family: var(--display);
            color: var(--ink);
            margin: 2em 0 0.6em;
            font-weight: 400;
        }
        .content h2 {
            font-size: 1.45rem;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
        }
        .content h3 { font-size: 1.18rem; }
        .content p { margin: 1em 0; }
        .content a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
        .content a:hover { color: var(--accent-dk); }

        .content code {
            font-family: var(--mono);
            font-size: 0.85em;
            background: var(--bd-surface-muted, #f3f1ed);
            color: var(--accent-dk);
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .content pre {
            background: var(--code-bg);
            color: var(--code-fg);
            padding: 20px 24px;
            border-radius: var(--radius);
            overflow-x: auto;
            line-height: 1.6;
            margin: 1.5em 0;
            border: 1px solid var(--bd-border, #21262d);
            position: relative;
        }
        .content pre code {
            font-family: var(--mono);
            font-size: 0.875em;
            background: none;
            color: inherit;
            border: none;
            padding: 0;
        }
        .content blockquote {
            margin: 1.5em 0;
            padding: 16px 20px;
            border-left: 3px solid var(--accent);
            background: var(--bd-highlight-bg, #fff8f8);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--ink-2);
            font-style: italic;
        }
        .content blockquote strong { color: var(--ink); font-style: normal; }
        .content table {
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
            max-width: 100%;
            margin: 1.5em 0;
            font-size: 0.92rem;
        }
        .content th, .content td { border: 1px solid var(--border); padding: 9px 14px; text-align: left; }
        .content th {
            background: var(--navy);
            color: var(--navy-fg);
            font-family: var(--sans);
            font-size: 0.78rem;
            letter-spacing: .04em;
            font-weight: 600;
        }
        .content tr:nth-child(even) { background: var(--bd-surface-muted, #faf9f7); }
        .content ul, .content ol { padding-left: 1.6em; margin: 1em 0; }
        .content li { margin: 0.3em 0; }
        .content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 24px auto;
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
        }

        /* ── 上下篇导航 ──────────────────────── */
        .post-nav {
            display: flex;
            gap: 12px;
            margin-top: 48px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
        }
        .post-nav a {
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--ink);
            border: 1px solid var(--border);
            background: var(--bg);
            transition: all .2s;
            min-width: 0;
        }
        .post-nav a:hover { border-color: var(--navy); background: var(--navy); color: var(--navy-fg); }
        .post-nav .nav-label {
            font-family: var(--sans);
            font-size: 0.7rem;
            letter-spacing: .08em;
            color: var(--ink-3);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .post-nav a:hover .nav-label { color: rgba(255,255,255,.6); }
        .post-nav .nav-title { font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .post-nav .nav-prev { text-align: left; }
        .post-nav .nav-next { text-align: right; }

        /* ── 返回链接 ─────────────────────────── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 28px;
            font-family: var(--sans);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-3);
            text-decoration: none;
            letter-spacing: .03em;
            transition: color .15s;
        }
        .back-link:hover { color: var(--accent); }

        /* ── 发布按钮 ─────────────────────────── */
        .publish-form { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
        .btn {
            font-family: var(--sans);
            font-weight: 700;
            padding: 10px 24px;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: .03em;
            transition: background .15s;
        }
        .btn:hover { background: var(--accent-dk); }

        /* ── 评论区 ───────────────────────────── */
        .comment-section { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--border); }
        .comment-section h3 {
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 24px;
            letter-spacing: .03em;
            text-transform: uppercase;
        }
        .comment-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
        .comment-author { font-family: var(--sans); font-weight: 700; font-size: 0.88rem; color: var(--ink); }
        .comment-time { font-size: 0.78rem; color: var(--ink-3); margin-left: 10px; }
        .comment-body { color: var(--ink-2); margin-top: 8px; line-height: 1.7; font-size: 0.95rem; }
        .comment-form {
            margin-top: 28px;
            background: var(--bg);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .comment-form h4 { font-family: var(--sans); font-size: 0.88rem; font-weight: 700; color: var(--ink); margin-bottom: 16px; letter-spacing: .04em; text-transform: uppercase; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-family: var(--sans); font-size: 0.75rem; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase; }
        .form-row input, .form-row textarea {
            width: 100%;
            padding: 9px 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--serif);
            font-size: 0.95rem;
            color: var(--ink);
            background: var(--card);
            transition: border-color .15s;
        }
        .form-row input:focus, .form-row textarea:focus { outline: none; border-color: var(--accent); }
        .form-row textarea { height: 110px; resize: vertical; }
        .submit-btn {
            font-family: var(--sans);
            font-weight: 700;
            padding: 9px 22px;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: .03em;
            transition: background .15s;
        }
        .submit-btn:hover { background: var(--accent-dk); }
        .commented-tip {
            background: #ecfdf5;
            color: #065f46;
            padding: 11px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.88rem;
            border: 1px solid #a7f3d0;
        }

        /* ── 专栏入口（左侧固定） ────────────── */
        .series-trigger {
            position: fixed;
            left: 0;
            top: 25%;
            transform: translateY(-50%);
            z-index: 300;
            background: var(--navy);
            border-radius: 0 8px 8px 0;
            box-shadow: 3px 0 16px rgba(0,0,0,.2);
            cursor: pointer;
            padding: 14px 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all .2s;
        }
        .series-trigger:hover { background: var(--accent); }
        .series-trigger-label {
            writing-mode: vertical-rl;
            font-family: var(--sans);
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,.7);
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .series-trigger-icon { font-size: 0.65rem; color: var(--navy-fg); transition: transform .25s; }
        .series-trigger.open .series-trigger-icon { transform: rotate(180deg); }

        /* ── 专栏面板 ────────────────────────── */
        .series-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background: var(--navy);
            color: var(--navy-fg);
            box-shadow: 6px 0 32px rgba(0,0,0,.3);
            z-index: 200;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform .3s cubic-bezier(.25,.46,.45,.94);
        }
        .series-panel.open { transform: translateX(0); }
        .series-panel-header {
            padding: 64px 20px 12px;
            font-family: var(--sans);
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,.4);
            letter-spacing: .12em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .series-name {
            padding: 14px 20px;
            font-family: var(--sans);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--navy-fg);
            border-bottom: 1px solid rgba(255,255,255,.08);
            line-height: 1.4;
        }
        .series-item {
            display: block;
            padding: 11px 20px;
            font-size: 0.82rem;
            text-decoration: none;
            color: rgba(255,255,255,.55);
            border-left: 3px solid transparent;
            transition: all .15s;
            line-height: 1.5;
        }
        .series-item:hover { background: rgba(255,255,255,.06); color: var(--navy-fg); border-left-color: var(--accent); }
        .series-item.active { background: rgba(255,255,255,.10); color: var(--navy-fg); border-left-color: var(--accent); font-weight: 600; }
        .series-item .order { color: rgba(255,255,255,.3); font-family: var(--mono); font-size: 0.75em; margin-right: 6px; }
        .series-item.active .order { color: var(--accent); }

        /* ── 遮罩 ────────────────────────────── */
        .series-overlay { display: none; position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,.3); backdrop-filter: blur(2px); }
        .series-overlay.open { display: block; }

        /* ── 移动端响应式 ────────────────────── */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                margin: 0;
                padding: 20px 16px 40px;
                border-radius: 0;
                box-shadow: none;
                border-left: none;
                border-right: none;
                border-top: none;
            }
            h1 { font-size: 1.5rem; }
            .content { font-size: 0.97rem; line-height: 1.75; }
            .content pre { padding: 14px 14px; font-size: 0.82em; }
            .content table { font-size: 0.82rem; }
            .post-nav { flex-direction: column; gap: 8px; }
            .post-nav .nav-next { text-align: left; }
            .post-nav .nav-title { white-space: normal; }
            .comment-form { padding: 16px; }
            /* 手机端：极窄小的专栏入口，不遮挡正文 */
            .series-trigger {
                padding: 8px 5px;
                gap: 4px;
                border-radius: 0 6px 6px 0;
                box-shadow: 2px 0 8px rgba(0,0,0,.18);
            }
            .series-trigger-label {
                font-size: 0.52rem;
                letter-spacing: .06em;
            }
            .series-trigger-icon { font-size: 0.52rem; }
        }

        @media (max-width: 480px) {
            .container { padding: 16px 12px 32px; }
            .content { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(true)}"></nav>
<div class="container">

    <!-- 专栏文章：左侧浮动入口 + fixed 覆盖面板（不影响正文布局）-->
    <th:block th:if="${series != null}">
        <!-- 遮罩 -->
        <div class="series-overlay" id="seriesOverlay" onclick="closeSeries()"></div>
        <!-- 左侧固定入口 -->
        <div class="series-trigger" id="seriesTrigger" onclick="toggleSeries()">
            <span class="series-trigger-label">专栏文章</span>
            <span class="series-trigger-icon">▶</span>
        </div>
        <!-- 展开面板（覆盖正文） -->
        <div class="series-panel" id="seriesPanel">
            <div class="series-panel-header">专栏文章</div>
            <div class="series-name" th:text="${series.name}">专栏名</div>
            <a th:each="item : ${seriesPosts}"
               th:href="@{/posts/{slug}(slug=${item.slug})}"
               th:classappend="${item.id == post.id ? ' active' : ''}"
               class="series-item">
                <span class="order" th:text="${item.seriesOrder} + '.'"></span>
                <span th:text="${item.title}">文章标题</span>
            </a>
        </div>
    </th:block>
    <script>
    function toggleSeries() {
        var panel = document.getElementById('seriesPanel');
        var trigger = document.getElementById('seriesTrigger');
        var overlay = document.getElementById('seriesOverlay');
        var isOpen = panel.classList.contains('open');
        panel.classList.toggle('open');
        trigger.classList.toggle('open');
        overlay.classList.toggle('open');
    }
    function closeSeries() {
        document.getElementById('seriesPanel').classList.remove('open');
        document.getElementById('seriesTrigger').classList.remove('open');
        document.getElementById('seriesOverlay').classList.remove('open');
    }
    </script>

    <h1 th:text="${post.title}">文章标题</h1>
    <div class="meta">
        <span th:if="${post.publishedAt != null}"
              th:text="'发布于 ' + ${#temporals.format(post.publishedAt, 'yyyy-MM-dd HH:mm')}"></span>
        <span th:if="${post.publishedAt == null}">
            草稿<span class="status-badge">未发布</span>
        </span>
        <span style="margin-left:12px;color:var(--ink-3);">👁 <span th:text="${pvCount}">0</span> 次阅读</span>
    </div>
    <div th:if="${not #lists.isEmpty(tags)}" class="tags">
        <a th:each="tag : ${tags}" th:href="@{/posts(tag=${tag.slug})}"
           th:text="'#' + ${tag.name}" class="tag">#标签</a>
    </div>
    <div class="content" th:utext="${renderedContent}">文章内容</div>
    <div class="publish-form" th:if="${canPublish}">
        <form th:action="@{/posts/{slug}/publish(slug=${post.slug})}" method="post">
            <button type="submit" class="btn">发布此文章</button>
        </form>
    </div>
    <a th:href="@{/posts}" class="back-link">← 返回列表</a>

    <!-- 上下篇导航 -->
    <div class="post-nav" th:if="${prevPost != null or nextPost != null}">
        <a th:if="${prevPost != null}"
           th:href="@{/posts/{slug}(slug=${prevPost.slug})}"
           class="nav-prev">
            <div class="nav-label">← 上一篇</div>
            <div class="nav-title" th:text="${prevPost.title}">上一篇标题</div>
        </a>
        <span th:if="${prevPost == null}" style="flex:1"></span>
        <a th:if="${nextPost != null}"
           th:href="@{/posts/{slug}(slug=${nextPost.slug})}"
           class="nav-next">
            <div class="nav-label">下一篇 →</div>
            <div class="nav-title" th:text="${nextPost.title}">下一篇标题</div>
        </a>
    </div>

    <!-- 评论区 -->
    <div class="comment-section">
        <h3>评论 <span th:text="'(' + ${#lists.size(comments)} + ')'" style="font-weight:400;color:var(--ink-3);font-size:0.9em;"></span></h3>
        <!-- 评论列表 -->
        <div th:each="c : ${comments}" class="comment-item">
            <a th:href="@{/u/{name}(name=${c.authorName})}"
               class="comment-author" th:text="${c.authorName}"
               style="text-decoration:none;color:inherit;">作者</a>
            <span class="comment-time" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span>
            <div class="comment-body" th:text="${c.content}">内容</div>
        </div>
        <div th:if="${#lists.isEmpty(comments)}" style="color:var(--ink-3);font-size:0.9em;margin-bottom:16px;">
            暂无评论，来留下第一条吧。
        </div>
        <!-- 已登录用户：显示评论表单 -->
        <div sec:authorize="hasAuthority('blog:comment:create')" class="comment-form">
            <h4>发表评论</h4>
            <form th:action="@{/posts/{slug}/comments(slug=${post.slug})}" method="post">
                <div class="form-row">
                    <label>内容 *</label>
                    <textarea name="content" required placeholder="写下你的想法..."></textarea>
                </div>
                <button type="submit" class="submit-btn">提交评论</button>
            </form>
        </div>
        <!-- 未登录：提示登录 -->
        <div sec:authorize="!isAuthenticated()"
             style="margin-top:20px;padding:16px 20px;background:var(--bg);
                    border-radius:var(--radius);border:1px solid var(--border);
                    text-align:center;font-family:var(--sans);font-size:0.9rem;color:var(--ink-2);">
            <a th:href="@{/login}" style="color:var(--accent);font-weight:600;">登录</a> 或
            <a th:href="@{/register}" style="color:var(--accent);font-weight:600;">注册</a>
            后才能发表评论
        </div>
    </div>

</div>
<!-- Mermaid 图表渲染 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
        primaryColor:       '#dae8fc',
        primaryTextColor:   '#1c1917',
        primaryBorderColor: '#6c8ebf',
        lineColor:          '#57534e',
        secondaryColor:     '#f7f5f0',
        tertiaryColor:      '#fff',
        background:         '#ffffff',
        mainBkg:            '#dae8fc',
        nodeBorder:         '#6c8ebf',
        clusterBkg:         '#f7f5f0',
        titleColor:         '#1c1917',
        edgeLabelBackground:'#ffffff',
        activeTaskBkgColor: '#e94560',
        activeTaskBorderColor: '#c73652',
        fontFamily:         "'JetBrains Mono', monospace",
        fontSize:           '13px',
    },
    flowchart:  { useMaxWidth: true, htmlLabels: true },
    sequence:   { useMaxWidth: true },
    gantt:      { useMaxWidth: true },
});

document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('pre code.language-mermaid').forEach(function (codeEl) {
        var pre = codeEl.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        // textContent 自动解码 HTML 实体（&gt; → > 等）
        div.textContent = codeEl.textContent;
        div.style.cssText = 'background:var(--card);padding:16px 0;text-align:center;';
        pre.replaceWith(div);
    });
    mermaid.run();
});
</script>
<!-- Schema.org 结构化数据：让 Google 展示发布时间、作者等富文本摘要 -->
<script type="application/ld+json" th:inline="javascript">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline":       /*[[${post.title}]]*/ "",
  "description":    /*[[${metaDescription}]]*/ "",
  "url":            /*[[${canonicalUrl}]]*/ "",
  "datePublished":  /*[[${post.publishedAt != null ? #temporals.format(post.publishedAt, 'yyyy-MM-dd') : ''}]]*/ "",
  "dateModified":   /*[[${post.updatedAt   != null ? #temporals.format(post.updatedAt,   'yyyy-MM-dd') : ''}]]*/ "",
  "author": {
    "@type": "Person",
    "name":  "ByteDepth"
  },
  "publisher": {
    "@type": "Organization",
    "name":  "ByteDepth",
    "url":   /*[[${canonicalUrl.replaceAll('/posts/.*', '')}]]*/ ""
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id":   /*[[${canonicalUrl}]]*/ ""
  }
}
</script>
