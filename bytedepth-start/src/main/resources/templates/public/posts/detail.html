<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <title th:text="${post.title} + ' - bytedepth'">文章详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #f7f5f0;
            --card:      #ffffff;
            --ink:       #1c1917;
            --ink-2:     #57534e;
            --ink-3:     #a8a29e;
            --accent:    #e94560;
            --accent-dk: #c73652;
            --navy:      #1a1a2e;
            --border:    #e7e4df;
            --code-bg:   #0d1117;
            --code-fg:   #e6edf3;
            --serif:     'Source Serif 4', Georgia, serif;
            --display:   'DM Serif Display', Georgia, serif;
            --sans:      'Outfit', system-ui, sans-serif;
            --mono:      'JetBrains Mono', 'Fira Code', monospace;
            --radius:    10px;
            --shadow:    0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--serif);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 容器 ─────────────────────────────── */
        .container {
            max-width: 80vw;
            margin: 48px auto;
            padding: 56px 64px 64px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* ── 文章标题区 ───────────────────────── */
        h1 {
            font-family: var(--display);
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            font-weight: 400;
            color: var(--ink);
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-bottom: 20px;
        }
        .meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-family: var(--sans);
            font-size: 0.82rem;
            color: var(--ink-3);
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }
        .meta-sep { color: var(--border); }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;
            letter-spacing: .03em;
        }

        /* ── 标签 ────────────────────────────── */
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
        .tag {
            font-family: var(--sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: .05em;
            color: var(--ink-2);
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 3px 11px;
            border-radius: 20px;
            text-decoration: none;
            transition: all .15s;
        }
        .tag:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ── 正文内容 ─────────────────────────── */
        .content { font-size: 1.05rem; line-height: 1.85; color: var(--ink); }
        .content h1,.content h2,.content h3,.content h4 {
            font-family: var(--display);
            color: var(--ink);
            margin: 2em 0 0.6em;
            font-weight: 400;
        }
        .content h2 {
            font-size: 1.45rem;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
        }
        .content h3 { font-size: 1.18rem; }
        .content p { margin: 1em 0; }
        .content a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
        .content a:hover { color: var(--accent-dk); }

        .content code {
            font-family: var(--mono);
            font-size: 0.85em;
            background: #f3f1ed;
            color: #c0392b;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #e8e4df;
        }
        .content pre {
            background: var(--code-bg);
            color: var(--code-fg);
            padding: 20px 24px;
            border-radius: var(--radius);
            overflow-x: auto;
            line-height: 1.6;
            margin: 1.5em 0;
            border: 1px solid #21262d;
            position: relative;
        }
        .content pre code {
            font-family: var(--mono);
            font-size: 0.875em;
            background: none;
            color: inherit;
            border: none;
            padding: 0;
        }
        .content blockquote {
            margin: 1.5em 0;
            padding: 16px 20px;
            border-left: 3px solid var(--accent);
            background: #fff8f8;
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--ink-2);
            font-style: italic;
        }
        .content blockquote strong { color: var(--ink); font-style: normal; }
        .content table {
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
            max-width: 100%;
            margin: 1.5em 0;
            font-size: 0.92rem;
        }
        .content th, .content td { border: 1px solid var(--border); padding: 9px 14px; text-align: left; }
        .content th {
            background: var(--navy);
            color: #fff;
            font-family: var(--sans);
            font-size: 0.78rem;
            letter-spacing: .04em;
            font-weight: 600;
        }
        .content tr:nth-child(even) { background: #faf9f7; }
        .content ul, .content ol { padding-left: 1.6em; margin: 1em 0; }
        .content li { margin: 0.3em 0; }
        .content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 24px auto;
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
        }

        /* ── 上下篇导航 ──────────────────────── */
        .post-nav {
            display: flex;
            gap: 12px;
            margin-top: 48px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
        }
        .post-nav a {
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--ink);
            border: 1px solid var(--border);
            background: var(--bg);
            transition: all .2s;
            min-width: 0;
        }
        .post-nav a:hover { border-color: var(--navy); background: var(--navy); color: #fff; }
        .post-nav .nav-label {
            font-family: var(--sans);
            font-size: 0.7rem;
            letter-spacing: .08em;
            color: var(--ink-3);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .post-nav a:hover .nav-label { color: rgba(255,255,255,.6); }
        .post-nav .nav-title { font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .post-nav .nav-prev { text-align: left; }
        .post-nav .nav-next { text-align: right; }

        /* ── 返回链接 ─────────────────────────── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 28px;
            font-family: var(--sans);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-3);
            text-decoration: none;
            letter-spacing: .03em;
            transition: color .15s;
        }
        .back-link:hover { color: var(--accent); }

        /* ── 发布按钮 ─────────────────────────── */
        .publish-form { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
        .btn {
            font-family: var(--sans);
            font-weight: 700;
            padding: 10px 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: .03em;
            transition: background .15s;
        }
        .btn:hover { background: var(--accent-dk); }

        /* ── 评论区 ───────────────────────────── */
        .comment-section { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--border); }
        .comment-section h3 {
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 24px;
            letter-spacing: .03em;
            text-transform: uppercase;
        }
        .comment-item { padding: 16px 0; border-bottom: 1px solid #f5f2ee; }
        .comment-author { font-family: var(--sans); font-weight: 700; font-size: 0.88rem; color: var(--ink); }
        .comment-time { font-size: 0.78rem; color: var(--ink-3); margin-left: 10px; }
        .comment-body { color: var(--ink-2); margin-top: 8px; line-height: 1.7; font-size: 0.95rem; }
        .comment-form {
            margin-top: 28px;
            background: var(--bg);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .comment-form h4 { font-family: var(--sans); font-size: 0.88rem; font-weight: 700; color: var(--ink); margin-bottom: 16px; letter-spacing: .04em; text-transform: uppercase; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-family: var(--sans); font-size: 0.75rem; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase; }
        .form-row input, .form-row textarea {
            width: 100%;
            padding: 9px 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--serif);
            font-size: 0.95rem;
            color: var(--ink);
            background: #fff;
            transition: border-color .15s;
        }
        .form-row input:focus, .form-row textarea:focus { outline: none; border-color: var(--accent); }
        .form-row textarea { height: 110px; resize: vertical; }
        .submit-btn {
            font-family: var(--sans);
            font-weight: 700;
            padding: 9px 22px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: .03em;
            transition: background .15s;
        }
        .submit-btn:hover { background: var(--accent-dk); }
        .commented-tip {
            background: #ecfdf5;
            color: #065f46;
            padding: 11px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.88rem;
            border: 1px solid #a7f3d0;
        }

        /* ── 专栏入口（左侧固定） ────────────── */
        .series-trigger {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 300;
            background: var(--navy);
            border-radius: 0 8px 8px 0;
            box-shadow: 3px 0 16px rgba(0,0,0,.2);
            cursor: pointer;
            padding: 14px 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all .2s;
        }
        .series-trigger:hover { background: var(--accent); }
        .series-trigger-label {
            writing-mode: vertical-rl;
            font-family: var(--sans);
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,.7);
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .series-trigger-icon { font-size: 0.65rem; color: #fff; transition: transform .25s; }
        .series-trigger.open .series-trigger-icon { transform: rotate(180deg); }

        /* ── 专栏面板 ────────────────────────── */
        .series-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background: var(--navy);
            color: #fff;
            box-shadow: 6px 0 32px rgba(0,0,0,.3);
            z-index: 200;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform .3s cubic-bezier(.25,.46,.45,.94);
        }
        .series-panel.open { transform: translateX(0); }
        .series-panel-header {
            padding: 64px 20px 12px;
            font-family: var(--sans);
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,.4);
            letter-spacing: .12em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .series-name {
            padding: 14px 20px;
            font-family: var(--sans);
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,.08);
            line-height: 1.4;
        }
        .series-item {
            display: block;
            padding: 11px 20px;
            font-size: 0.82rem;
            text-decoration: none;
            color: rgba(255,255,255,.55);
            border-left: 3px solid transparent;
            transition: all .15s;
            line-height: 1.5;
        }
        .series-item:hover { background: rgba(255,255,255,.06); color: #fff; border-left-color: var(--accent); }
        .series-item.active { background: rgba(233,69,96,.15); color: #fff; border-left-color: var(--accent); font-weight: 600; }
        .series-item .order { color: rgba(255,255,255,.3); font-family: var(--mono); font-size: 0.75em; margin-right: 6px; }
        .series-item.active .order { color: var(--accent); }

        /* ── 遮罩 ────────────────────────────── */
        .series-overlay { display: none; position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,.3); backdrop-filter: blur(2px); }
        .series-overlay.open { display: block; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">

    <!-- 专栏文章：左侧浮动入口 + fixed 覆盖面板（不影响正文布局）-->
    <th:block th:if="${series != null}">
        <!-- 遮罩 -->
        <div class="series-overlay" id="seriesOverlay" onclick="closeSeries()"></div>
        <!-- 左侧固定入口 -->
        <div class="series-trigger" id="seriesTrigger" onclick="toggleSeries()">
            <span class="series-trigger-label">专栏文章</span>
            <span class="series-trigger-icon">▶</span>
        </div>
        <!-- 展开面板（覆盖正文） -->
        <div class="series-panel" id="seriesPanel">
            <div class="series-panel-header">专栏文章</div>
            <div class="series-name" th:text="${series.name}">专栏名</div>
            <a th:each="item : ${seriesPosts}"
               th:href="@{/posts/{id}(id=${item.id})}"
               th:classappend="${item.id == post.id ? ' active' : ''}"
               class="series-item">
                <span class="order" th:text="${item.seriesOrder} + '.'"></span>
                <span th:text="${item.title}">文章标题</span>
            </a>
        </div>
    </th:block>
    <script>
    function toggleSeries() {
        var panel = document.getElementById('seriesPanel');
        var trigger = document.getElementById('seriesTrigger');
        var overlay = document.getElementById('seriesOverlay');
        var isOpen = panel.classList.contains('open');
        panel.classList.toggle('open');
        trigger.classList.toggle('open');
        overlay.classList.toggle('open');
    }
    function closeSeries() {
        document.getElementById('seriesPanel').classList.remove('open');
        document.getElementById('seriesTrigger').classList.remove('open');
        document.getElementById('seriesOverlay').classList.remove('open');
    }
    </script>

    <h1 th:text="${post.title}">文章标题</h1>
    <div class="meta">
        <span th:if="${post.publishedAt != null}"
              th:text="'发布于 ' + ${#temporals.format(post.publishedAt, 'yyyy-MM-dd HH:mm')}"></span>
        <span th:if="${post.publishedAt == null}">
            草稿<span class="status-badge">未发布</span>
        </span>
        <span style="margin-left:12px;color:#bbb;">👁 <span th:text="${pvCount}">0</span> 次阅读</span>
    </div>
    <div th:if="${not #lists.isEmpty(tags)}" class="tags">
        <a th:each="tag : ${tags}" th:href="@{/posts(tag=${tag.slug})}"
           th:text="'#' + ${tag.name}" class="tag">#标签</a>
    </div>
    <div class="content" th:utext="${renderedContent}">文章内容</div>
    <div class="publish-form" th:if="${post.status == 'DRAFT'}">
        <form th:action="@{/posts/{id}/publish(id=${post.id})}" method="post">
            <button type="submit" class="btn">发布此文章</button>
        </form>
    </div>
    <a th:href="@{/posts}" class="back-link">← 返回列表</a>

    <!-- 上下篇导航 -->
    <div class="post-nav" th:if="${prevPost != null or nextPost != null}">
        <a th:if="${prevPost != null}"
           th:href="@{/posts/{id}(id=${prevPost.id})}"
           class="nav-prev">
            <div class="nav-label">← 上一篇</div>
            <div class="nav-title" th:text="${prevPost.title}">上一篇标题</div>
        </a>
        <span th:if="${prevPost == null}" style="flex:1"></span>
        <a th:if="${nextPost != null}"
           th:href="@{/posts/{id}(id=${nextPost.id})}"
           class="nav-next">
            <div class="nav-label">下一篇 →</div>
            <div class="nav-title" th:text="${nextPost.title}">下一篇标题</div>
        </a>
    </div>

    <!-- 评论区 -->
    <div class="comment-section">
        <h3>评论 <span th:text="'(' + ${#lists.size(comments)} + ')'" style="font-weight:400;color:#888;font-size:0.9em;"></span></h3>
        <div class="commented-tip" th:if="${param.commented}">评论已提交，审核通过后显示。</div>
        <div th:each="c : ${comments}" class="comment-item">
            <span class="comment-author" th:text="${c.authorName}">作者</span>
            <span class="comment-time" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span>
            <div class="comment-body" th:text="${c.content}">内容</div>
        </div>
        <div th:if="${#lists.isEmpty(comments)}" style="color:#aaa;font-size:0.9em;margin-bottom:16px;">暂无评论，来留下第一条吧。</div>
        <div class="comment-form">
            <h4 style="margin:0 0 16px;color:#333;">发表评论</h4>
            <form th:action="@{/posts/{id}/comments(id=${post.id})}" method="post">
                <div class="form-row">
                    <label>昵称 *</label>
                    <input type="text" name="authorName" required placeholder="你的昵称">
                </div>
                <div class="form-row">
                    <label>邮箱（可选）</label>
                    <input type="email" name="authorEmail" placeholder="不公开显示">
                </div>
                <div class="form-row">
                    <label>内容 *</label>
                    <textarea name="content" required placeholder="写下你的想法..."></textarea>
                </div>
                <button type="submit" class="submit-btn">提交评论</button>
            </form>
        </div>
    </div>

</div>
<!-- Mermaid 图表渲染 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
        primaryColor:       '#dae8fc',
        primaryTextColor:   '#1c1917',
        primaryBorderColor: '#6c8ebf',
        lineColor:          '#57534e',
        secondaryColor:     '#f7f5f0',
        tertiaryColor:      '#fff',
        background:         '#ffffff',
        mainBkg:            '#dae8fc',
        nodeBorder:         '#6c8ebf',
        clusterBkg:         '#f7f5f0',
        titleColor:         '#1c1917',
        edgeLabelBackground:'#ffffff',
        activeTaskBkgColor: '#e94560',
        activeTaskBorderColor: '#c73652',
        fontFamily:         "'JetBrains Mono', monospace",
        fontSize:           '13px',
    },
    flowchart:  { useMaxWidth: true, htmlLabels: true },
    sequence:   { useMaxWidth: true },
    gantt:      { useMaxWidth: true },
});

document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('pre code.language-mermaid').forEach(function (codeEl) {
        var pre = codeEl.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        // textContent 自动解码 HTML 实体（&gt; → > 等）
        div.textContent = codeEl.textContent;
        div.style.cssText = 'background:#fff;padding:16px 0;text-align:center;';
        pre.replaceWith(div);
    });
    mermaid.run();
});
</script>
</body>
</html>
