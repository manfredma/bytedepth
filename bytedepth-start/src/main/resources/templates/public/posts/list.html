<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <th:block th:replace="~{fragments/pwa-head :: pwa}"></th:block>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-switcher.js}"></script>
    <title th:text="${activeCategory != null ? activeCategory + ' - 文章' : (activeTag != null ? '#' + activeTag + ' - 文章' : '全部文章')} + ' - bytedepth'">文章列表</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: var(--bd-bg, #f0f2f5); color: var(--bd-text, #1a1a2e); }
        .layout { max-width: 1060px; margin: 40px auto; padding: 0 20px; display: flex; gap: 24px; }
        /* 左侧分类导航 */
        .sidebar { width: 200px; flex-shrink: 0; }
        .sidebar-card { background: var(--bd-surface, white); border-radius: 8px; box-shadow: var(--bd-shadow, 0 2px 8px rgba(0,0,0,.06)); overflow: hidden; }
        .sidebar-title { padding: 14px 16px 10px; font-size: 0.78em; font-weight: 700; color: var(--bd-text-subtle, #999); text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--bd-border, #f0f0f0); }
        .cat-link { display: flex; align-items: center; gap: 8px; padding: 9px 16px; font-size: 0.9em; text-decoration: none; color: var(--bd-text-muted, #444); border-left: 3px solid transparent; transition: all .15s; }
        .cat-link:hover { background: var(--bd-highlight-bg, #fdf0f2); color: var(--bd-accent, #e94560); border-left-color: var(--bd-accent, #e94560); }
        .cat-link.active { background: var(--bd-highlight-bg, #fdf0f2); color: var(--bd-accent, #e94560); border-left-color: var(--bd-accent, #e94560); font-weight: 600; }
        .cat-link.child { padding-left: 28px; font-size: 0.85em; color: var(--bd-text-muted, #666); }
        .cat-link.child::before { content: "└ "; color: var(--bd-text-subtle, #ccc); }
        .cat-icon { font-size: 1.05em; flex-shrink: 0; line-height: 1; }
        .cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* 移动端：侧栏缩为纯图标条 */
        @media (max-width: 768px) {
            .layout { margin: 10px auto; padding: 0 6px; gap: 8px; }
            .sidebar { width: 46px; flex-shrink: 0; }
            .sidebar-title { padding: 8px 0; font-size: 0.6em; text-align: center; letter-spacing: 0; }
            .cat-link { padding: 9px 0; justify-content: center; gap: 0; border-left-width: 2px; }
            .cat-link.child { padding-left: 0; }
            .cat-link.child::before { content: none; }
            .cat-icon { font-size: 1.2rem; }
            .cat-name { display: none; }
        }
        /* 主内容 */
        .main { flex: 1; min-width: 0; }
        /* 标签过滤栏 */
        .tag-bar-wrap { background: var(--bd-surface, white); padding: 14px 18px 10px; border-radius: 8px; box-shadow: var(--bd-shadow, 0 2px 8px rgba(0,0,0,.06)); margin-bottom: 18px; }
        .tag-bar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; overflow: hidden; transition: max-height .3s ease; }
        .tag-bar.collapsed { max-height: 105px; }
        .tag-bar.expanded { max-height: 9999px; }
        .tag-bar-label { color: var(--bd-text-subtle, #aaa); font-size: 0.78em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; flex-shrink: 0; }
        .tag-chip { padding: 3px 11px; border-radius: 14px; font-size: 0.8em; text-decoration: none; background: var(--bd-surface-muted, #f0f0f0); color: var(--bd-text-muted, #555); transition: all .15s; }
        .tag-chip:hover { background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white); }
        .tag-chip.active { background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white); font-weight: 600; }
        .tag-chip .cnt { opacity: 0.65; font-size: 0.88em; margin-left: 2px; }
        .tag-toggle { margin-top: 8px; text-align: right; }
        .tag-toggle-btn { background: none; border: none; color: var(--bd-accent, #e94560); font-size: 0.8em; font-weight: 600; cursor: pointer; padding: 2px 6px; letter-spacing: .03em; }
        .tag-toggle-btn:hover { text-decoration: underline; }
        /* 文章卡片 */
        .post-item { background: var(--bd-surface, white); padding: 20px 22px; margin: 10px 0; border-radius: 8px; box-shadow: var(--bd-shadow, 0 2px 8px rgba(0,0,0,.07)); transition: transform .15s; }
        .post-item:hover { transform: translateY(-2px); }
        .post-item h2 { margin: 0 0 8px; font-size: 1.1em; }
        .post-item h2 a { color: var(--bd-text, #1a1a2e); text-decoration: none; }
        .post-item h2 a:hover { color: var(--bd-accent, #e94560); }
        .post-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .meta-date { color: var(--bd-text-subtle, #bbb); font-size: 0.8em; }
        .meta-cat { background: var(--bd-info-bg, #e8f0fe); color: var(--bd-info-text, #1967d2); padding: 2px 9px; border-radius: 10px; font-size: 0.75em; text-decoration: none; }
        .meta-cat:hover { background: var(--bd-info-hover-bg, #1967d2); color: var(--bd-info-hover-text, white); }
        .empty { color: var(--bd-text-subtle, #999); text-align: center; padding: 60px; background: var(--bd-surface, white); border-radius: 8px; }
        .active-banner { background: var(--bd-highlight-bg, #fff8f8); border-left: 3px solid var(--bd-accent, #e94560); padding: 9px 14px; margin-bottom: 14px; border-radius: 0 6px 6px 0; font-size: 0.88em; color: var(--bd-text-muted, #555); }
        .active-banner a { color: var(--bd-accent, #e94560); text-decoration: none; }
        h1 { margin: 0 0 18px; color: var(--bd-text, #1a1a2e); font-size: 1.4em; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--bd-border, #eee); }
        .page-btn { padding: 7px 18px; border-radius: 6px; font-size: 0.88em; font-weight: 600;
            text-decoration: none; border: 1px solid var(--bd-border, #ddd); background: var(--bd-surface, white); color: var(--bd-text-muted, #555); transition: all .15s; }
        .page-btn:hover { background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white); border-color: var(--bd-accent, #e94560); }
        .page-info { color: var(--bd-text-subtle, #999); font-size: 0.85em; }
        /* 分页 fragment 样式 */
        .pagination-wrap { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--bd-border, #eee); }
        .page-info-top { text-align: center; font-size: 0.82em; color: var(--bd-text-subtle, #aaa); margin-bottom: 8px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; }
        .page-btn { padding: 6px 13px; border-radius: 6px; font-size: 0.88em; font-weight: 600; text-decoration: none; border: 1px solid var(--bd-border, #ddd); background: var(--bd-surface, white); color: var(--bd-text-muted, #555); transition: all .15s; }
        .page-btn:hover { background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white); border-color: var(--bd-accent, #e94560); }
        .page-btn.current { background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white); border-color: var(--bd-accent, #e94560); font-weight: 700; }
        .page-btn.disabled { color: var(--bd-text-subtle, #bbb); cursor: default; pointer-events: none; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar(true)}"></nav>
<div class="layout">

    <!-- 左侧分类 -->
    <aside class="sidebar">
        <div class="sidebar-card">
            <div class="sidebar-title">分类</div>
            <a th:href="@{/posts}" class="cat-link" title="全部文章"
               th:classappend="${activeCategory == null and activeTag == null ? ' active' : ''}">
                <span class="cat-icon">📰</span>
                <span class="cat-name">全部文章</span>
            </a>
            <a th:each="cat : ${allCategories}"
               th:href="@{/posts(category=${cat.slug})}"
               th:title="${cat.name}"
               class="cat-link"
               th:classappend="${(activeCategory == cat.slug ? ' active' : '') + (cat.depth > 0 ? ' child' : '')}">
                <span class="cat-icon">
                    <th:block th:switch="${cat.slug}">
                        <th:block th:case="'architecture'">🏗️</th:block>
                        <th:block th:case="'distributed'">🌐</th:block>
                        <th:block th:case="'microservices'">🧩</th:block>
                        <th:block th:case="'devops'">♾️</th:block>
                        <th:block th:case="'data'">📊</th:block>
                        <th:block th:case="'language'">💻</th:block>
                        <th:block th:case="'performance'">⚡</th:block>
                        <th:block th:case="'engineering'">🔧</th:block>
                        <th:block th:case="'source-code'">🔬</th:block>
                        <th:block th:case="'reading'">📖</th:block>
                        <th:block th:case="'computer-fundamentals'">🖥️</th:block>
                        <th:block th:case="'ai-coding'">🤖</th:block>
                        <th:block th:case="'framework'">🧰</th:block>
                        <th:block th:case="'database'">🗄️</th:block>
                        <th:block th:case="'uncategorized'">📁</th:block>
                        <th:block th:case="*">📂</th:block>
                    </th:block>
                </span>
                <span class="cat-name" th:text="${cat.name}">分类</span>
            </a>
        </div>

        <!-- 专栏入口 -->
        <div class="sidebar-card" style="margin-top:12px;" th:if="${not #lists.isEmpty(allSeries)}">
            <div class="sidebar-title">专栏</div>
            <a th:href="@{/columns}" class="cat-link" title="全部专栏">
                <span class="cat-icon">📚</span>
                <span class="cat-name">全部专栏</span>
            </a>
            <a th:each="s, iterStat : ${allSeries}"
               th:if="${iterStat.index < 5}"
               th:href="@{/columns/{slug}(slug=${s.slug})}"
               th:title="${s.name}"
               class="cat-link">
                <span class="cat-icon">📖</span>
                <span class="cat-name" th:text="${s.name}">专栏名</span>
            </a>
            <a th:if="${#lists.size(allSeries) > 5}"
               th:href="@{/columns}"
               class="cat-link"
               style="color:var(--bd-accent, #e94560);font-size:0.82em;font-weight:600;">
                <span class="cat-icon">···</span>
                <span class="cat-name">更多专栏 →</span>
            </a>
        </div>
    </aside>

    <!-- 主内容 -->
    <div class="main">
        <h1 th:text="${activeCategory != null ? activeCategory : (activeTag != null ? '#' + activeTag : '全部文章')}">全部文章</h1>

        <!-- 标签过滤栏 -->
        <div class="tag-bar-wrap" th:if="${not #lists.isEmpty(allTags)}">
            <div class="tag-bar collapsed" id="tagBar">
                <span class="tag-bar-label">标签</span>
                <a th:href="@{/posts(category=${activeCategory})}" class="tag-chip"
                   th:classappend="${activeTag == null ? ' active' : ''}">全部</a>
                <a th:each="t : ${allTags}"
                   th:href="@{/posts(tag=${t.slug})}"
                   th:text="${t.name} + ' (' + ${t.count} + ')'"
                   class="tag-chip"
                   th:classappend="${activeTag == t.slug ? ' active' : ''}">标签</a>
            </div>
            <div class="tag-toggle">
                <button class="tag-toggle-btn" id="tagToggleBtn" onclick="toggleTags()">展开全部 ▾</button>
            </div>
        </div>
        <script>
        function toggleTags() {
            var bar = document.getElementById('tagBar');
            var btn = document.getElementById('tagToggleBtn');
            if (bar.classList.contains('collapsed')) {
                bar.classList.replace('collapsed', 'expanded');
                btn.textContent = '收起 ▴';
            } else {
                bar.classList.replace('expanded', 'collapsed');
                btn.textContent = '展开全部 ▾';
            }
        }
        </script>

        <!-- 当前过滤提示 -->
        <div class="active-banner" th:if="${activeTag != null}">
            标签 <strong th:text="'#' + ${activeTag}"></strong> &nbsp;·&nbsp;
            <a th:href="@{/posts}">清除 ×</a>
        </div>
        <div class="active-banner" th:if="${activeCategory != null}">
            分类 <strong th:text="${activeCategory}"></strong> &nbsp;·&nbsp;
            <a th:href="@{/posts}">清除 ×</a>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty">该分类/标签下暂无文章</div>

        <div th:each="post : ${posts}" class="post-item">
            <h2><a th:href="@{/posts/{slug}(slug=${post.slug})}" th:text="${post.title}">文章标题</a></h2>
            <div class="post-meta">
                <span class="meta-date" th:if="${post.publishedAt != null}"
                      th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}"></span>
                <a th:if="${post.categoryName != null}"
                   th:href="@{/posts(category=${post.categorySlug})}"
                   th:text="${post.categoryName}"
                   class="meta-cat"></a>
            </div>
        </div>

        <div th:if="${totalPages > 1}">
            <div th:replace="~{fragments/pagination :: pagination(
                ${currentPage}, ${totalPages}, ${total}, ${pageSize},
                '/posts?' + (${activeTag} != null ? 'tag=' + ${activeTag} + '&' : '') + (${activeCategory} != null ? 'category=' + ${activeCategory} + '&' : ''))}"></div>
        </div>
    </div>
</div>
</body>
</html>
