<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>文章列表 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .post-item { background: white; padding: 24px; margin: 12px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .post-item h2 { margin: 0 0 8px; font-size: 1.2em; }
        .post-item h2 a { color: #1a1a2e; text-decoration: none; }
        .post-item h2 a:hover { color: #e94560; }
        .meta { color: #999; font-size: 0.88em; margin: 0; }
        .empty { color: #999; text-align: center; padding: 60px; background: white; border-radius: 8px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <h1>全部文章</h1>
    <div th:if="${#lists.isEmpty(posts)}" class="empty">
        暂无发布的文章，<a th:href="@{/posts/new}" style="color:#e94560;">写第一篇</a>？
    </div>
    <div th:each="post : ${posts}" class="post-item">
        <h2><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a></h2>
        <p class="meta" th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd HH:mm')}">发布时间</p>
    </div>
</div>
</body>
</html>
