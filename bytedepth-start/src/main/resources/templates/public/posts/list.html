<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title th:text="${activeCategory != null ? activeCategory + ' - 文章' : (activeTag != null ? '#' + activeTag + ' - 文章' : '全部文章')} + ' - bytedepth'">文章列表</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .layout { max-width: 1060px; margin: 40px auto; padding: 0 20px; display: flex; gap: 24px; }
        /* 左侧分类导航 */
        .sidebar { width: 200px; flex-shrink: 0; }
        .sidebar-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
        .sidebar-title { padding: 14px 16px 10px; font-size: 0.78em; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #f0f0f0; }
        .cat-link { display: block; padding: 9px 16px; font-size: 0.9em; text-decoration: none; color: #444; border-left: 3px solid transparent; transition: all .15s; }
        .cat-link:hover { background: #fdf0f2; color: #e94560; border-left-color: #e94560; }
        .cat-link.active { background: #fdf0f2; color: #e94560; border-left-color: #e94560; font-weight: 600; }
        .cat-link.child { padding-left: 28px; font-size: 0.85em; color: #666; }
        .cat-link.child::before { content: "└ "; color: #ccc; }
        /* 主内容 */
        .main { flex: 1; min-width: 0; }
        /* 标签过滤栏 */
        .tag-bar-wrap { background: white; padding: 14px 18px 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 18px; }
        .tag-bar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; overflow: hidden; transition: max-height .3s ease; }
        .tag-bar.collapsed { max-height: 105px; }
        .tag-bar.expanded { max-height: 9999px; }
        .tag-bar-label { color: #aaa; font-size: 0.78em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; flex-shrink: 0; }
        .tag-chip { padding: 3px 11px; border-radius: 14px; font-size: 0.8em; text-decoration: none; background: #f0f0f0; color: #555; transition: all .15s; }
        .tag-chip:hover { background: #e94560; color: white; }
        .tag-chip.active { background: #e94560; color: white; font-weight: 600; }
        .tag-chip .cnt { opacity: 0.65; font-size: 0.88em; margin-left: 2px; }
        .tag-toggle { margin-top: 8px; text-align: right; }
        .tag-toggle-btn { background: none; border: none; color: #e94560; font-size: 0.8em; font-weight: 600; cursor: pointer; padding: 2px 6px; letter-spacing: .03em; }
        .tag-toggle-btn:hover { text-decoration: underline; }
        /* 文章卡片 */
        .post-item { background: white; padding: 20px 22px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.07); transition: transform .15s; }
        .post-item:hover { transform: translateY(-2px); }
        .post-item h2 { margin: 0 0 8px; font-size: 1.1em; }
        .post-item h2 a { color: #1a1a2e; text-decoration: none; }
        .post-item h2 a:hover { color: #e94560; }
        .post-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .meta-date { color: #bbb; font-size: 0.8em; }
        .meta-cat { background: #e8f0fe; color: #1967d2; padding: 2px 9px; border-radius: 10px; font-size: 0.75em; text-decoration: none; }
        .meta-cat:hover { background: #1967d2; color: white; }
        .empty { color: #999; text-align: center; padding: 60px; background: white; border-radius: 8px; }
        .active-banner { background: #fff8f8; border-left: 3px solid #e94560; padding: 9px 14px; margin-bottom: 14px; border-radius: 0 6px 6px 0; font-size: 0.88em; color: #555; }
        .active-banner a { color: #e94560; text-decoration: none; }
        h1 { margin: 0 0 18px; color: #1a1a2e; font-size: 1.4em; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
        .page-btn { padding: 7px 18px; border-radius: 6px; font-size: 0.88em; font-weight: 600;
            text-decoration: none; border: 1px solid #ddd; background: white; color: #555; transition: all .15s; }
        .page-btn:hover { background: #e94560; color: white; border-color: #e94560; }
        .page-info { color: #999; font-size: 0.85em; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="layout">

    <!-- 左侧分类 -->
    <aside class="sidebar">
        <div class="sidebar-card">
            <div class="sidebar-title">分类</div>
            <a th:href="@{/posts}" class="cat-link"
               th:classappend="${activeCategory == null and activeTag == null ? ' active' : ''}">全部文章</a>
            <a th:each="cat : ${allCategories}"
               th:href="@{/posts(category=${cat.slug})}"
               th:text="${cat.depth > 0 ? cat.name : cat.name}"
               class="cat-link"
               th:classappend="${(activeCategory == cat.slug ? ' active' : '') + (cat.depth > 0 ? ' child' : '')}">分类</a>
        </div>
    </aside>

    <!-- 主内容 -->
    <div class="main">
        <h1 th:text="${activeCategory != null ? activeCategory : (activeTag != null ? '#' + activeTag : '全部文章')}">全部文章</h1>

        <!-- 标签过滤栏 -->
        <div class="tag-bar-wrap" th:if="${not #lists.isEmpty(allTags)}">
            <div class="tag-bar collapsed" id="tagBar">
                <span class="tag-bar-label">标签</span>
                <a th:href="@{/posts(category=${activeCategory})}" class="tag-chip"
                   th:classappend="${activeTag == null ? ' active' : ''}">全部</a>
                <a th:each="t : ${allTags}"
                   th:href="@{/posts(tag=${t.slug})}"
                   th:text="${t.name} + ' (' + ${t.count} + ')'"
                   class="tag-chip"
                   th:classappend="${activeTag == t.slug ? ' active' : ''}">标签</a>
            </div>
            <div class="tag-toggle">
                <button class="tag-toggle-btn" id="tagToggleBtn" onclick="toggleTags()">展开全部 ▾</button>
            </div>
        </div>
        <script>
        function toggleTags() {
            var bar = document.getElementById('tagBar');
            var btn = document.getElementById('tagToggleBtn');
            if (bar.classList.contains('collapsed')) {
                bar.classList.replace('collapsed', 'expanded');
                btn.textContent = '收起 ▴';
            } else {
                bar.classList.replace('expanded', 'collapsed');
                btn.textContent = '展开全部 ▾';
            }
        }
        </script>

        <!-- 当前过滤提示 -->
        <div class="active-banner" th:if="${activeTag != null}">
            标签 <strong th:text="'#' + ${activeTag}"></strong> &nbsp;·&nbsp;
            <a th:href="@{/posts}">清除 ×</a>
        </div>
        <div class="active-banner" th:if="${activeCategory != null}">
            分类 <strong th:text="${activeCategory}"></strong> &nbsp;·&nbsp;
            <a th:href="@{/posts}">清除 ×</a>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty">该分类/标签下暂无文章</div>

        <div th:each="post : ${posts}" class="post-item">
            <h2><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a></h2>
            <div class="post-meta">
                <span class="meta-date" th:if="${post.publishedAt != null}"
                      th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}"></span>
                <a th:if="${post.categoryName != null}"
                   th:href="@{/posts(category=${post.categorySlug})}"
                   th:text="${post.categoryName}"
                   class="meta-cat"></a>
            </div>
        </div>

        <div th:if="${totalPages > 1}" class="pagination">
            <a th:if="${hasPrev}"
               th:href="@{/posts(page=${currentPage - 1}, tag=${activeTag}, category=${activeCategory})}"
               class="page-btn">← 上一页</a>
            <span th:if="${!hasPrev}" class="page-btn" style="opacity:.4;cursor:default;">← 上一页</span>
            <span class="page-info" th:text="${currentPage} + ' / ' + ${totalPages}"></span>
            <a th:if="${hasNext}"
               th:href="@{/posts(page=${currentPage + 1}, tag=${activeTag}, category=${activeCategory})}"
               class="page-btn">下一页 →</a>
            <span th:if="${!hasNext}" class="page-btn" style="opacity:.4;cursor:default;">下一页 →</span>
        </div>
    </div>
</div>
</body>
</html>
