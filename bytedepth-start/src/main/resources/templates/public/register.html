<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-switcher.js}"></script>
    <title>注册 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               margin: 0; background: var(--bd-nav-bg, #1a1a2e); color: var(--bd-text, #1a1a2e);
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--bd-surface, white); padding: 40px 48px; border-radius: 12px;
                width: 380px; box-shadow: var(--bd-shadow-strong, 0 8px 32px rgba(0,0,0,.3)); }
        h1 { margin: 0 0 4px; color: var(--bd-text, #1a1a2e); font-size: 1.6em; }
        .subtitle { color: var(--bd-text-subtle, #888); font-size: 0.9em; margin-bottom: 28px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 0.88em; font-weight: 500; color: var(--bd-text-muted, #555); margin-bottom: 5px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid var(--bd-border, #ddd);
                border-radius: 6px; font-size: 1em; outline: none; background: var(--bd-surface, white); color: var(--bd-text, #1a1a2e); }
        input:focus { border-color: var(--bd-accent, #e94560); }
        .btn { width: 100%; padding: 11px; background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white);
               border: none; border-radius: 6px; font-size: 1em;
               font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: var(--bd-accent-hover, #c73652); }
        .error { background: #fff0f0; color: #c00; padding: 10px 14px;
                 border-radius: 6px; font-size: 0.9em; margin-bottom: 16px;
                 border-left: 3px solid var(--bd-danger, #c00); }
        .hint { font-size: 0.8em; color: var(--bd-text-subtle, #aaa); margin-top: 8px; line-height: 1.5; }
        .back { display: block; text-align: center; margin-top: 20px;
                color: var(--bd-text-subtle, #888); font-size: 0.9em; text-decoration: none; }
        .back:hover { color: var(--bd-accent, #e94560); }
    </style>
</head>
<body>
<div class="card">
    <h1>bytedepth</h1>
    <p class="subtitle">创建账号</p>
    <div class="error" th:if="${param.error}" th:text="${param.error[0]}">错误信息</div>
    <form th:action="@{/register}" method="post">
        <div class="field">
            <label>用户名</label>
            <input type="text" name="username" autofocus
                   minlength="2" maxlength="50"
                   placeholder="2-50 个字符" required>
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" name="password"
                   minlength="6" placeholder="至少 6 位" required>
            <p class="hint">注册后需等待管理员审核，审核通过后方可登录。</p>
        </div>
        <button type="submit" class="btn">注册</button>
    </form>
    <a th:href="@{/login}" class="back">已有账号？去登录</a>
    <a href="javascript:void(0)" id="backLink" class="back">← 返回</a>
    <script>
    // 有浏览历史则返回上一页，否则回首页兜底
    (function () {
        var link = document.getElementById('backLink');
        if (window.history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) {
            link.addEventListener('click', function (e) { e.preventDefault(); window.history.back(); });
        } else {
            link.setAttribute('href', '/');
        }
    })();
    </script>
</div>
</body>
</html>
