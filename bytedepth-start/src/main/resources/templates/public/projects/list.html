<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <title>项目 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; margin-top: 24px; }
        .card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: transform .2s; }
        .card:hover { transform: translateY(-3px); }
        .card h2 { margin: 0 0 10px; color: #1a1a2e; font-size: 1.2em; }
        .card p { color: #555; font-size: 0.95em; line-height: 1.6; margin: 0 0 14px; }
        .tech-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .tech-tag { background: #e8f4fd; color: #2980b9; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; }
        .links { display: flex; gap: 12px; }
        .link-btn { padding: 6px 14px; border-radius: 6px; font-size: 0.88em; text-decoration: none; font-weight: 500; }
        .link-github { background: #1a1a2e; color: white; }
        .link-demo { background: #e94560; color: white; }
        .empty { color: #888; text-align: center; padding: 60px; background: white; border-radius: 8px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <h1>项目</h1>
    <div th:if="${#lists.isEmpty(projects)}" class="empty">暂无项目展示</div>
    <div class="grid">
        <div th:each="p : ${projects}" class="card">
            <h2 th:text="${p.name}">项目名</h2>
            <p th:text="${p.description}">描述</p>
            <div class="tech-tags">
                <span th:each="tech : ${p.techList}" th:text="${tech}" class="tech-tag">技术</span>
            </div>
            <div class="links">
                <a th:if="${p.githubUrl}" th:href="${p.githubUrl}" class="link-btn link-github" target="_blank">GitHub</a>
                <a th:if="${p.demoUrl}" th:href="${p.demoUrl}" class="link-btn link-demo" target="_blank">演示</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
