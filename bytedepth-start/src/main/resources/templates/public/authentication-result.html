<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/favicon-head :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-switcher.js}"></script>
    <title>认证结果 - bytedepth</title>
    <link rel="stylesheet" th:href="@{/css/authentication.css}">
</head>
<body class="auth-result-page">
<main class="auth-result-card">
    <p class="auth-result-brand">bytedepth · 认证结果</p>
    <th:block th:if="${param.oidc != null and param.oidc[0] == 'pending'}">
        <h1 class="auth-result-title">等待审核</h1>
        <p class="auth-result-message">Hearth 身份已验证，bytedepth 本地账号仍在等待管理员审核。审核通过后可重新登录。</p>
    </th:block>
    <th:block th:if="${param.oidc != null and param.oidc[0] == 'blocked'}">
        <h1 class="auth-result-title">账号已被封禁</h1>
        <p class="auth-result-message">Hearth 身份已验证，但该 bytedepth 本地账号已被封禁，请联系业务系统管理员。</p>
    </th:block>
    <th:block th:if="${param.oidc == null or (param.oidc[0] != 'pending' and param.oidc[0] != 'blocked')}">
        <h1 class="auth-result-title">登录未完成</h1>
        <p class="auth-result-message">系统尚未建立有效会话。请重新登录；如果问题持续，请联系管理员。</p>
    </th:block>
    <a class="auth-result-retry" th:href="@{/oauth2/authorization/hearth}">重新前往 Hearth 登录</a>
    <a class="auth-result-home" th:href="@{/}">返回首页</a>
</main>
</body>
</html>
