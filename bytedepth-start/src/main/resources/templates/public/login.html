<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/favicon.svg}">
    <th:block th:replace="~{fragments/pwa-head :: pwa}"></th:block>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-switcher.js}"></script>
    <title>登录 - bytedepth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--serif);
               margin: 0; background: var(--bd-nav-bg, #1a1a2e); color: var(--bd-text, #1a1a2e);
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--bd-surface, white); padding: 40px 48px; border-radius: 12px;
                width: 360px; box-shadow: var(--bd-shadow-strong, 0 8px 32px rgba(0,0,0,.3)); }
        h1 { margin: 0 0 8px; color: var(--bd-text, #1a1a2e); font-size: 1.6em; }
        .subtitle { color: var(--bd-text-subtle, #888); font-size: 0.9em; margin-bottom: 28px; }
        .field { margin-bottom: 16px; }
        .remember { display: flex; align-items: center; gap: 8px; margin: -3px 0 12px; color: var(--bd-text-muted, #555); font-size: .88em; }
        .remember input { width: auto; margin: 0; }
        label { display: block; font-size: 0.88em; font-weight: 500; color: var(--bd-text-muted, #555); margin-bottom: 5px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid var(--bd-border, #ddd);
                border-radius: 6px; font-size: 1em; outline: none; background: var(--bd-surface, white); color: var(--bd-text, #1a1a2e); }
        input:focus { border-color: var(--bd-accent, #e94560); }
        .btn { width: 100%; padding: 11px; background: var(--bd-accent, #e94560); color: var(--bd-accent-text, white);
               border: none; border-radius: 6px; font-size: 1em; font-weight: 600;
               cursor: pointer; margin-top: 8px; }
        .btn:hover { background: var(--bd-accent-hover, #c73652); }
        .error { background: #fff0f0; color: #c00; padding: 10px 14px;
                 border-radius: 6px; font-size: 0.9em; margin-bottom: 16px;
                 border-left: 3px solid var(--bd-danger, #c00); }
        .success { background: #ecfdf5; color: #065f46; padding: 10px 14px;
                   border-radius: 6px; font-size: 0.9em; margin-bottom: 16px;
                   border-left: 3px solid var(--bd-success, #2ecc71); }
        .back { display: block; text-align: center; margin-top: 12px;
                color: var(--bd-text-subtle, #888); font-size: 0.9em; text-decoration: none; }
        .back:hover { color: var(--bd-accent, #e94560); }
    </style>
</head>
<body>
<div class="card">
    <h1>bytedepth</h1>
    <p class="subtitle">登录你的账号</p>

    <!-- 注册成功提示 -->
    <div class="success" th:if="${param.registered}">
        注册申请已提交！请等待管理员审核后再登录。
    </div>

    <!-- 登录错误提示 -->
    <div class="error" th:if="${param.error}">
        用户名或密码错误，或账号待审核 / 已封禁。
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label>用户名</label>
            <input type="text" name="username" autofocus>
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" name="password">
        </div>
        <label class="remember"><input type="checkbox" name="remember-me"> 记住我 30 天</label>
        <button type="submit" class="btn">登录</button>
    </form>

    <a th:href="@{/register}" class="back">还没有账号？去注册 →</a>
    <a href="javascript:void(0)" id="backLink" class="back">← 返回</a>
    <script>
    // 有浏览历史则返回上一页，否则回首页兜底
    (function () {
        var link = document.getElementById('backLink');
        if (window.history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) {
            link.addEventListener('click', function (e) { e.preventDefault(); window.history.back(); });
        } else {
            link.setAttribute('href', '/');
        }
    })();
    </script>
</div>
</body>
</html>
