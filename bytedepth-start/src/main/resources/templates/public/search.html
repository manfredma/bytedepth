<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title th:text="(${q} != '' ? '搜索：' + ${q} : '搜索') + ' - bytedepth'">搜索</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 760px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; font-size: 1.4em; margin: 0 0 20px; }

        .search-form { display: flex; gap: 8px; margin-bottom: 28px; }
        .search-input {
            flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 1em; outline: none;
        }
        .search-input:focus { border-color: #e94560; }
        .search-btn {
            padding: 10px 20px; background: #e94560; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600;
        }
        .search-btn:hover { background: #c73652; }

        .result-count { color: #999; font-size: 0.88em; margin-bottom: 16px; }

        .result-item {
            background: white; padding: 20px 22px; margin-bottom: 12px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        .result-title { margin: 0 0 8px; font-size: 1.1em; }
        .result-title a { color: #1a1a2e; text-decoration: none; }
        .result-title a:hover { color: #e94560; }
        .result-title em { color: #e94560; font-style: normal; font-weight: 600; }

        .result-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
        .meta-cat { background: #e8f0fe; color: #1967d2; padding: 2px 9px; border-radius: 10px; font-size: 0.75em; text-decoration: none; }
        .meta-tag { background: #f0f0f0; color: #555; padding: 2px 9px; border-radius: 10px; font-size: 0.75em; text-decoration: none; }

        .result-snippet { color: #555; font-size: 0.9em; line-height: 1.6; }
        .result-snippet em { color: #e94560; font-style: normal; font-weight: 600; background: #fff5f7; padding: 0 2px; border-radius: 2px; }

        .empty { text-align: center; color: #999; padding: 60px 0; }
        .empty p { margin: 8px 0; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container">
    <h1>搜索</h1>

    <form class="search-form" action="/search" method="get">
        <input class="search-input" type="text" name="q" th:value="${q}" placeholder="搜索文章标题、内容、标签…" autofocus />
        <button class="search-btn" type="submit">搜索</button>
    </form>

    <div th:if="${q != ''}" class="result-count">
        <span th:if="${not #lists.isEmpty(results)}"
              th:text="'找到 ' + ${#lists.size(results)} + ' 篇相关文章'"></span>
        <span th:if="${#lists.isEmpty(results)}">未找到相关文章</span>
    </div>

    <div th:if="${#lists.isEmpty(results) and q != ''}" class="empty">
        <p>没有找到与 "<strong th:text="${q}"></strong>" 相关的文章</p>
        <p style="font-size:0.88em;">试试换个关键词，或者<a href="/posts" style="color:#e94560;">浏览全部文章</a></p>
    </div>

    <div th:each="r : ${results}" class="result-item">
        <h2 class="result-title">
            <a th:href="@{/posts/{id}(id=${r.id})}" th:utext="${r.title}">标题</a>
        </h2>
        <div class="result-meta">
            <a th:if="${r.categoryName != ''}"
               th:href="@{/posts(category=${r.categorySlug})}"
               th:text="${r.categoryName}"
               class="meta-cat"></a>
            <span th:each="tag : ${r.tags}" th:text="'#' + ${tag}" class="meta-tag"></span>
        </div>
        <div th:if="${r.content != ''}" class="result-snippet"
             th:utext="${#strings.abbreviate(r.content, 200)}"></div>
    </div>
</div>
</body>
</html>
