<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="pwa">
    <meta th:if="${environment == 'staging'}" name="robots" content="noindex, nofollow, noarchive">
    <link th:if="${environment != 'staging'}" rel="alternate" type="application/rss+xml" title="bytedepth RSS" href="/feed.xml">
    <!-- PWA: Manifest -->
    <link th:if="${environment == 'staging'}" rel="manifest" href="/manifest-staging.json">
    <link th:if="${environment != 'staging'}" rel="manifest" href="/manifest.json">
    <th:block th:replace="~{fragments/favicon-head :: favicon}"></th:block>
    <!-- PWA: 主题色（Android 地址栏、iOS 状态栏） -->
    <meta name="theme-color" content="#1a1a2e">
    <!-- PWA: 视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA: iOS Safari 独立模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="bytedepth">
    <!-- Google Search Console 所有权验证 -->
    <meta name="google-site-verification" content="p3YAtkvB-tWByPivO_wiUXVBkOBt8YCZp-VOiaMg3qA">
    <!-- PWA: Service Worker 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                // Service Worker 本身必须每次检查更新，不能沿用 HTTP 缓存中的旧脚本。
                navigator.serviceWorker.register('/sw.js', {updateViaCache: 'none'})
                    .catch(function (err) { console.warn('SW 注册失败:', err); });
            });
        }
    </script>
</th:block>
</head>
</html>
