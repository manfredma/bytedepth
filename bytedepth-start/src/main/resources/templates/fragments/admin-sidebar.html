<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  后台侧边栏 fragment。
  用法：<aside th:replace="~{fragments/admin-sidebar :: sidebar('posts')}"></aside>
  active 可选值：dashboard | posts | comments | categories | tags | series
               | users | analytics | view-logs | projects | ops
-->
<th:block th:fragment="sidebar(active)">
<button type="button"
        class="admin-sidebar-toggle"
        id="adminSidebarToggle"
        aria-controls="adminSidebar"
        aria-expanded="false">
    <span class="admin-sidebar-toggle-icon" aria-hidden="true">☰</span>
    <span class="admin-sidebar-toggle-text">后台菜单</span>
</button>
<div class="admin-sidebar-overlay" id="adminSidebarOverlay" aria-hidden="true"></div>
<aside class="admin-sidebar" id="adminSidebar" aria-label="后台管理菜单">

    <!-- 内容管理 -->
    <div class="admin-sidebar-section">内容管理</div>
    <a href="/admin/posts" class="admin-sidebar-item" sec:authorize="hasAnyAuthority('admin:dashboard:view', 'blog:post:create')"
       th:classappend="${active == 'posts'} ? ' active' : ''">
        <span class="si-icon">📝</span>文章管理
    </a>
    <a href="/admin/comments" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'comments'} ? ' active' : ''">
        <span class="si-icon">💬</span>评论管理
    </a>
    <a href="/admin/categories" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'categories'} ? ' active' : ''">
        <span class="si-icon">🗂️</span>分类管理
    </a>
    <a href="/admin/tags" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'tags'} ? ' active' : ''">
        <span class="si-icon">🏷️</span>标签管理
    </a>
    <a href="/admin/series" class="admin-sidebar-item" sec:authorize="hasAnyAuthority('admin:dashboard:view', 'blog:series:create:own', 'blog:series:edit:own')"
       th:classappend="${active == 'series'} ? ' active' : ''">
        <span class="si-icon">📚</span>专栏管理
    </a>
    <a href="/admin/users" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'users'} ? ' active' : ''">
        <span class="si-icon">👥</span>用户审核
    </a>

    <!-- 数据分析 -->
    <div class="admin-sidebar-section" sec:authorize="hasAuthority('admin:dashboard:view')">数据分析</div>
    <a href="/admin/analytics" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'analytics'} ? ' active' : ''">
        <span class="si-icon">📊</span>访问统计
    </a>
    <a href="/admin/view-logs" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'view-logs'} ? ' active' : ''">
        <span class="si-icon">📋</span>访问日志
    </a>

    <!-- 系统运维 -->
    <div class="admin-sidebar-section" sec:authorize="hasAuthority('admin:dashboard:view')">系统运维</div>
    <a href="/admin/ops" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'ops'} ? ' active' : ''">
        <span class="si-icon">🛠️</span>系统运维
    </a>

    <!-- 网站 -->
    <div class="admin-sidebar-section" sec:authorize="hasAuthority('admin:dashboard:view')">网站</div>
    <a href="/admin/projects/new" class="admin-sidebar-item" sec:authorize="hasAuthority('admin:dashboard:view')"
       th:classappend="${active == 'projects'} ? ' active' : ''">
        <span class="si-icon">🚀</span>项目展示
    </a>
    <a href="/" class="admin-sidebar-item" target="_blank">
        <span class="si-icon">🌐</span>查看前台 ↗
    </a>

</aside>
<script>
(function () {
    var toggle = document.getElementById('adminSidebarToggle');
    var aside = document.getElementById('adminSidebar');
    var overlay = document.getElementById('adminSidebarOverlay');
    if (!toggle || !aside || !overlay) return;

    function setOpen(open) {
        aside.classList.toggle('open', open);
        overlay.classList.toggle('open', open);
        document.body.classList.toggle('admin-menu-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.querySelector('.admin-sidebar-toggle-icon').textContent = open ? '×' : '☰';
        toggle.querySelector('.admin-sidebar-toggle-text').textContent = open ? '关闭菜单' : '后台菜单';
    }

    toggle.addEventListener('click', function () {
        setOpen(!aside.classList.contains('open'));
    });
    overlay.addEventListener('click', function () {
        setOpen(false);
    });
    aside.querySelectorAll('.admin-sidebar-item').forEach(function (item) {
        item.addEventListener('click', function () {
            setOpen(false);
        });
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            setOpen(false);
        }
    });
})();
</script>
</th:block>
</body>
</html>
