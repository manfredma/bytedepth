<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="navbar(showThemeSwitcher)">
<link rel="stylesheet" th:href="@{/css/nav.css}">
<link rel="stylesheet" th:href="@{/css/bd-dialog.css}">
<script defer th:src="@{/js/bd-dialog.js}"></script>
<nav class="nav-bar">
    <div class="nav-inner">
        <div class="nav-left">
            <a th:href="@{/}" class="nav-brand">
                <img th:src="@{/icons/logo.svg}" alt="bd" width="28" height="28">
                <span>bytedepth</span>
            </a>
            <div class="nav-primary">
                <a th:href="@{/posts}">文章</a>
                <a th:href="@{/columns}">专栏</a>
                <a th:href="@{/projects}">项目</a>
                <a th:href="@{/releases}">版本</a>
            </div>
        </div>
        <div class="nav-actions">
            <form action="/search" method="get" class="nav-search">
                <input type="text" name="q" placeholder="搜索文章…" />
                <button type="submit">🔍</button>
            </form>
            <div class="theme-switcher" th:classappend="${showThemeSwitcher} ? '' : ' nav-theme-placeholder'">
                <button th:if="${showThemeSwitcher}" type="button" class="theme-trigger" aria-label="切换主题" aria-expanded="false">◐</button>
                <div th:if="${showThemeSwitcher}" class="theme-menu">
                    <button type="button" class="theme-option" data-theme-option="default" aria-pressed="true">
                        <span class="theme-swatch default"></span><span>默认</span>
                    </button>
                    <button type="button" class="theme-option" data-theme-option="paper" aria-pressed="false">
                        <span class="theme-swatch paper"></span><span>纸张阅读</span>
                    </button>
                    <button type="button" class="theme-option" data-theme-option="blue" aria-pressed="false">
                        <span class="theme-swatch blue"></span><span>清爽蓝</span>
                    </button>
                    <button type="button" class="theme-option" data-theme-option="green" aria-pressed="false">
                        <span class="theme-swatch green"></span><span>森林绿</span>
                    </button>
                    <button type="button" class="theme-option" data-theme-option="midnight" aria-pressed="false">
                        <span class="theme-swatch midnight"></span><span>深夜代码</span>
                    </button>
                    <button type="button" class="theme-option" data-theme-option="rose" aria-pressed="false">
                        <span class="theme-swatch rose"></span><span>玫瑰暖色</span>
                    </button>
                </div>
            </div>
            <div class="nav-auth">
                <a sec:authorize="hasAnyAuthority('admin:dashboard:view', 'blog:post:create', 'blog:series:create:own')"
                   th:href="@{/admin}" class="nav-admin">后台</a>
                <a sec:authorize="hasAuthority('blog:post:create')"
                   th:href="@{/posts/new}" class="nav-write">写文章</a>
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/u/{u}(u=${#authentication.name})}"
                   th:text="${#authentication.name}">用户名</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout">
                    <button type="submit">退出</button>
                </form>
                <a sec:authorize="!isAuthenticated()"
                   th:href="@{/login}">登录</a>
                <a sec:authorize="!isAuthenticated()"
                   th:href="@{/register}" class="nav-register">注册</a>
            </div>
            <a th:href="@{/about}" class="nav-about">关于</a>
        </div>
    </div>
</nav>
</th:block>
</body>
</html>
