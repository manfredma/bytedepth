spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: bytedepth
  datasource:
    url: jdbc:mysql://localhost:3306/bytedepth?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: true
            paths:
              - /css/**
              - /js/**
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    timeout: 60m
    redis:
      # 登录主体类曾调整包路径；升级命名空间可使旧 Redis 会话自然失效，
      # 避免旧序列化数据在请求开始阶段反序列化失败。
      namespace: bytedepth:session:v2

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${BYTEDEPTH_SESSION_COOKIE_SECURE:false}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

bytedepth:
  site:
    url: ${BYTEDEPTH_SITE_URL:https://bytedepth.cn}
  upload:
    image-dir: ${user.home}/bytedepth/images
  search:
    url: ${BYTEDEPTH_SEARCH_URL:http://localhost:7700}
    api-key: ${BYTEDEPTH_SEARCH_API_KEY:bytedepth-search-key}
  geoip:
    # GeoLite2-City.mmdb 路径。留空则 IP 地理解析禁用。
    # 下载：https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
    # 部署时设置：export BYTEDEPTH_GEOIP_DB_PATH=/opt/bytedepth/GeoLite2-City.mmdb
    db-path: ${BYTEDEPTH_GEOIP_DB_PATH:}
  deploy:
    socket-path: ${BYTEDEPTH_DEPLOY_SOCKET_PATH:}
  visit-filter:
    enabled: true
    rules:
      - id: python-urllib
        field: user-agent
        match: prefix
        value: Python-urllib
      - id: curl
        field: user-agent
        match: prefix
        value: curl/
      - id: wget
        field: user-agent
        match: prefix
        value: Wget/
      - id: go-http-client
        field: user-agent
        match: prefix
        value: Go-http-client
      - id: java-client
        field: user-agent
        match: prefix
        value: Java/
      - id: apache-http-client
        field: user-agent
        match: prefix
        value: Apache-HttpClient
      - id: okhttp
        field: user-agent
        match: prefix
        value: okhttp
      - id: postman
        field: user-agent
        match: prefix
        value: PostmanRuntime
      - id: bot
        field: user-agent
        match: contains
        value: bot
      - id: crawler
        field: user-agent
        match: contains
        value: crawler
      - id: spider
        field: user-agent
        match: contains
        value: spider
  rate-limit:
    # Redis is shared by every application instance, so these quotas are global
    # rather than per-JVM. Environment variables can override all connection values.
    redis:
      host: ${BYTEDEPTH_RATE_LIMIT_REDIS_HOST:${spring.data.redis.host}}
      port: ${BYTEDEPTH_RATE_LIMIT_REDIS_PORT:${spring.data.redis.port}}
      password: ${BYTEDEPTH_RATE_LIMIT_REDIS_PASSWORD:${spring.data.redis.password:}}
      database: ${BYTEDEPTH_RATE_LIMIT_REDIS_DATABASE:0}
      timeout: ${BYTEDEPTH_RATE_LIMIT_REDIS_TIMEOUT:1s}
    login-ip:
      capacity: 5
      period: 1m
    login-username:
      capacity: 10
      period: 15m
    register-ip:
      capacity: 3
      period: 1h
    comment-rating-ip:
      capacity: 10
      period: 1m
    upload-ip:
      capacity: 20
      period: 1h
