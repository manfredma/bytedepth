spring:
  application:
    name: bytedepth
  datasource:
    url: jdbc:mysql://localhost:3306/bytedepth?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

bytedepth:
  site:
    url: ${BYTEDEPTH_SITE_URL:https://bytedepth.cn}
  upload:
    image-dir: ${user.home}/bytedepth/images
  search:
    url: ${BYTEDEPTH_SEARCH_URL:http://localhost:7700}
    api-key: ${BYTEDEPTH_SEARCH_API_KEY:bytedepth-search-key}
